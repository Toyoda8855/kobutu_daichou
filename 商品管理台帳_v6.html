   棚卸Excel出力（仕様書12章準拠）
   =========================================================== */
/* ===========================================================
   v6.2: スキャン結果同期
   - GAS の inv_scan シートから当月対象のレコードを取得し、
     PC側 invChecked に「追加」する（既存チェックは削除しない）。
   - state.products に存在しない管理番号や、在庫中以外の商品は除外。
   =========================================================== */
async function syncScanToInvChecked(){
  // (1) GAS未設定チェック
  if(!state.gas || !state.gas.url){
    toast('GASデプロイURLが未設定です（設定タブで入力してください）', 'warn');
    return;
  }
  // (2) 対象月（state.invMonthが空なら今月）
  const targetMonth = state.invMonth || thisMonthYM();
  // 確認ダイアログ
  const ok = confirm(
    'GAS の inv_scan シートから ' + targetMonth + ' のスキャン結果を取得し、\n' +
    '棚卸チェックリストに反映します。既存のチェック状態は上書きされません。実行しますか？'
  );
  if(!ok) return;

  // ローディング状態に切替
  const btn = document.getElementById('btnSyncScan');
  const origHtml = btn ? btn.innerHTML : null;
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i>同期中...'; }

  try{
    // (3) GAS から inv_scan を取得
    const rows = await gasApi.getInvScan();
    if(!Array.isArray(rows)){
      toast('スキャン結果の取得に失敗しました（応答形式が不正）', 'error');
      return;
    }

    // (4) 対象月で絞り込み（inventory_month が空のレコードは後方互換で全件対象）
    const targetRecords = rows.filter(r => {
      const im = (r && r.inventory_month != null) ? String(r.inventory_month).trim() : '';
      return im === '' || im === targetMonth;
    });

    // (5) invChecked へ反映（追加のみ・削除なし）
    // 商品の存在＆在庫中チェック用のマップ
    const inStockMap = new Map();
    state.products.forEach(p => {
      if(p && p.id && isInStock(p)) inStockMap.set(p.id, p);  // v6.4: 出品中も対象
    });

    let added = 0;       // 新規にチェック追加した件数
    let alreadyChecked = 0; // すでにチェック済みだった件数
    let unknown = 0;     // products に存在しない管理番号
    let notInStock = 0;  // 存在するが在庫中ではない
    const seen = new Set();

    targetRecords.forEach(r => {
      const id = r && r.scanned_id ? String(r.scanned_id).trim() : '';
      if(!id) return;
      if(seen.has(id)) return; // 同一IDの重複スキャンは1件として扱う
      seen.add(id);
      if(!inStockMap.has(id)){
        // 存在しないか在庫中でないか
        const exists = state.products.some(p => p.id === id);
        if(!exists){ unknown++; } else { notInStock++; }
        return;
      }
      if(state.invChecked[id]){ alreadyChecked++; return; }
      state.invChecked[id] = true;
      added++;
    });

    // (6) ローカル保存
    saveInv();

    // (7) トースト通知
    const parts = [];
    parts.push(added + ' 件をチェック済みにしました');
    if(alreadyChecked > 0) parts.push('既存チェック ' + alreadyChecked + ' 件');
    if(unknown > 0) parts.push('不明品 ' + unknown + ' 件はスキップ');
    if(notInStock > 0) parts.push('在庫中以外 ' + notInStock + ' 件はスキップ');
    toast('スキャン結果から ' + parts.join(' / '), 'success');

  }catch(e){
    console.error('[syncScanToInvChecked] failed', e);
    toast('スキャン結果の同期に失敗: ' + (e && e.message || e), 'error');
  }finally{
    // ローディング状態を元に戻す
    if(btn){ btn.disabled = !state.gas.url; if(origHtml!=null) btn.innerHTML = origHtml; }
    // (8) 再描画
    try { renderInventoryView(); } catch(_){}
  }
}

function exportInventoryExcel(){
  const ym = state.invMonth;
  if(!ym){ toast('対象月を選択してください','warn'); return; }
  if(typeof XLSX === 'undefined'){ toast('SheetJSが読み込まれていません','error'); return; }

  const monthProducts = state.products.filter(p => (p.date||'').startsWith(ym));
  if(monthProducts.length === 0){ toast('対象月の商品がありません','warn'); return; }

  // --- シート1: 棚卸リスト ---
  const headers1 = ['管理番号','品名','ブランド','部門コード','部門名','ランク','棚番号','入荷日','仕入価格','状態','ステータス','販路','販売日','売上価格','粗利','棚卸確認','備考'];
  const rows1 = monthProducts.map(p => {
    const cat = CATS_MAP[p.cat] || {name:''};
    const profit = (p.salePrice!=='' && p.salePrice!=null) ? Number(p.salePrice||0)-Number(p.cost||0) : '';
    return [
      p.id||'', p.name||'', p.brand||'', p.cat||'', cat.name||'',
      p.rank||'', p.shelf||'', fmtDate(p.date), Number(p.cost||0),
      p.cond||'', p.status||'', p.channel||'',
      fmtDate(p.saleDate||''), (p.salePrice===''||p.salePrice==null)?'':Number(p.salePrice),
      profit, state.invChecked[p.id] ? '確認済' : '未確認', p.desc||''
    ];
  });
  const aoa1 = [headers1, ...rows1];
  const ws1 = XLSX.utils.aoa_to_sheet(aoa1);

  // 列幅
  const colWidths = [16,30,18,8,12,8,10,12,12,12,10,10,12,12,12,10,40];
  ws1['!cols'] = colWidths.map(w => ({wch:w}));

  // オートフィルター
  const range = XLSX.utils.decode_range(ws1['!ref']);
  ws1['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:range.e.r, c:headers1.length-1}})};

  // スタイル付与
  // ※注: SheetJS Community版（CDN）はセルの色・フォントスタイルをxlsxに書き込まない仕様。
  //   そのため背景色等は s プロパティとして付与しておく（xlsx-js-style 等への差し替えで有効化可能）。
  //   数値書式（#,##0）は cell.z でCommunity版でも有効。
  const headerStyle = {
    fill:{patternType:'solid',fgColor:{rgb:'185FA5'},bgColor:{rgb:'185FA5'}},
    font:{color:{rgb:'FFFFFF'},bold:true,sz:11},
    alignment:{horizontal:'center',vertical:'center'},
  };
  for(let c=0; c<headers1.length; c++){
    const addr = XLSX.utils.encode_cell({r:0,c});
    if(ws1[addr]) ws1[addr].s = headerStyle;
  }
  for(let r=1; r<aoa1.length; r++){
    const p = monthProducts[r-1];
    let fill = null, fontColor = null;
    if(p.status === '販売済')      fill = 'E6F1FB';
    else if(p.status === 'キャンセル' || p.status === 'キャンセル・返品'){ fill = 'F1EFE8'; fontColor = '6B655A'; }
    else if(p.status === '出品中')                                       { fill = 'FBEFD9'; }  // v6.4
    else if(isInStock(p) && !state.invChecked[p.id])                      { fill = 'FAEEDA'; }
    for(let c=0; c<headers1.length; c++){
      const addr = XLSX.utils.encode_cell({r,c});
      if(!ws1[addr]) continue;
      const sty = {};
      if(fill) sty.fill = {patternType:'solid',fgColor:{rgb:fill},bgColor:{rgb:fill}};
      if(fontColor) sty.font = {color:{rgb:fontColor}};
      // 数値列カンマ区切り（z プロパティはCommunity版でも書き込まれる）
      if([8,13,14].includes(c) && typeof ws1[addr].v === 'number'){
        ws1[addr].z = '#,##0';
        sty.numFmt = '#,##0';
      }
      if(Object.keys(sty).length) ws1[addr].s = sty;
    }
  }

  // --- シート2: 集計サマリー ---
  const inStock   = monthProducts.filter(p => p.status === '在庫中');
  const listedList= monthProducts.filter(p => p.status === '出品中');
  const soldList  = monthProducts.filter(p => p.status === '販売済');
  const cancelList= monthProducts.filter(p => p.status === 'キャンセル' || p.status === 'キャンセル・返品');
  const checkedN  = monthProducts.filter(p => state.invChecked[p.id]).length;
  const uncheckedN= inStock.filter(p => !state.invChecked[p.id]).length;
  const costSum   = monthProducts.reduce((s,p)=>s+Number(p.cost||0),0);
  const stockSum  = inStock.reduce((s,p)=>s+Number(p.cost||0),0);
  const salesSum  = soldList.reduce((s,p)=>s+Number(p.salePrice||0),0);
  const profitSum = soldList.reduce((s,p)=>s+(Number(p.salePrice||0)-Number(p.cost||0)),0);

  const aoa2 = [
    ['項目','値'],
    ['対象月', ymLabel(ym)],
    ['総商品数', monthProducts.length],
    ['在庫中', inStock.length],
    ['出品中', listedList.length],
    ['販売済', soldList.length],
    ['キャンセル・返品', cancelList.length],
    ['棚卸確認済', checkedN],
    ['棚卸未確認（在庫中）', uncheckedN],
    ['仕入総額', costSum],
    ['在庫評価額', stockSum],
    ['売上合計', salesSum],
    ['粗利合計', profitSum],
    [''],
    ['部門別在庫数',''],
  ];
  // 部門別在庫数
  CATS.forEach(c => {
    const n = inStock.filter(p => p.cat === c.code).length;
    if(n > 0) aoa2.push([`${c.code} ${c.name}`, n]);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(aoa2);
  ws2['!cols'] = [{wch:22},{wch:18}];
  // ヘッダー行スタイル
  ['A1','B1'].forEach(a => { if(ws2[a]) ws2[a].s = headerStyle; });
  // 数値書式
  for(let r=2; r<aoa2.length; r++){
    const addr = XLSX.utils.encode_cell({r,c:1});
    if(ws2[addr] && typeof ws2[addr].v === 'number'){
      ws2[addr].z = '#,##0';
      ws2[addr].s = {numFmt:'#,##0'};
    }
  }

  // ブック作成
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, '棚卸リスト');
  XLSX.utils.book_append_sheet(wb, ws2, '集計サマリー');
  const fname = `棚卸_${ym.replace('-','')}_府中センター.xlsx`;
  XLSX.writeFile(wb, fname);
  toast(`Excel出力しました（${monthProducts.length}件）`,'success');
}

function renderVendorView(){
  const root = document.getElementById('viewVendor');
  if(!state.vendorFilter) state.vendorFilter = { requiredOnly:false, expiringOnly:false };
  const f = state.vendorFilter;

  // 期限関連の判定
  const THREE_YEARS_MS = 3 * 365 * 24 * 60 * 60 * 1000;
  const ONE_YEAR_MS    = 365 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  const isExpired = p => {
    if(!p.date) return false;
    if(isInStock(p)) return false;  // v6.4: 出品中も対象外
    const t = new Date(p.date).getTime();
    if(isNaN(t)) return false;
    return (now - t) >= THREE_YEARS_MS;
  };
  const isExpiringSoon = p => {
    if(!p.date) return false;
    if(isInStock(p)) return false;  // v6.4: 出品中も対象外
    const t = new Date(p.date).getTime();
    if(isNaN(t)) return false;
    const diff = now - t;
    return diff < THREE_YEARS_MS && diff >= (THREE_YEARS_MS - ONE_YEAR_MS);
  };
  const fmtLimit = p => {
    if(!p.date) return '—';
    const d = new Date(p.date);
    if(isNaN(d.getTime())) return p.date;
    d.setFullYear(d.getFullYear() + 3);
    const yy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${yy}/${mm}/${dd}`;
  };

  const expiredCount  = state.products.filter(isExpired).length;
  const expiringCount = state.products.filter(isExpiringSoon).length;

  // 並べ替え（新しい順）
  let records = [...state.products].sort((a,b) => {
    const ka = a.createdAt || a.date || '';
    const kb = b.createdAt || b.date || '';
    return kb.localeCompare(ka);
  });
  // フィルター適用
  if(f.requiredOnly){
    records = records.filter(p => requiresVendorRecord(p.cost, p.cat));
  }
  if(f.expiringOnly){
    records = records.filter(p => isExpired(p) || isExpiringSoon(p));
  }

  root.innerHTML = `
    <div class="view-header">
      <div class="view-title"><i class="ti ti-book"></i>古物台帳</div>
      <div class="view-actions">
        <span style="font-size:12px;color:var(--text-mute);">古物営業法 第16条準拠 — 表示 ${records.length}件 / 全 ${state.products.length}件</span>
      </div>
    </div>

    <!-- 保存期限管理サマリーカード -->
    <div class="import-card" style="margin-bottom:14px;">
      <h3><i class="ti ti-clock"></i>保存期限管理（3年間保存義務）</h3>
      <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
        <div>
          <div style="font-size:11.5px;color:var(--text-sub);font-weight:600;">期限切れ（削除対象）</div>
          <div style="font-size:24px;font-weight:700;color:${expiredCount>0?'#B71C1C':'#176939'};">${expiredCount}件</div>
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--text-sub);font-weight:600;">期限まで1年以内</div>
          <div style="font-size:24px;font-weight:700;color:${expiringCount>0?'#A06B00':'#5C6473'};">${expiringCount}件</div>
        </div>
        <div style="flex:1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" id="btnVendorExpiringOnly">
            <i class="ti ti-eye"></i>期限切れ・間近のみ表示
          </button>
          <button class="btn btn-danger btn-sm" id="btnVendorBulkDelete" ${expiredCount===0?'disabled':''}>
            <i class="ti ti-trash"></i>期限切れ ${expiredCount}件を一括削除
          </button>
        </div>
      </div>
    </div>

    <!-- フィルター -->
    <div style="display:flex;gap:18px;margin-bottom:12px;font-size:12.5px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="vfRequired" ${f.requiredOnly?'checked':''}>

        <input type="checkbox" id="vfExpiring" ${f.expiringOnly?'checked':''}>
        期限切れ・1年以内のみ表示
      </label>
    </div>

    ${records.length === 0 ? `
      <div class="empty-mini"><i class="ti ti-book-off"></i>表示する取引記録がありません</div>
    ` : `
      <div class="data-table-wrap">
        <table class="data-table">
          <thead><tr>
            <th>取引日</th><th>管理番号</th><th>品名</th>
            <th>取引区分</th><th>個/法</th>
            <th>取引相手</th><th>住所</th>
            <th>職業</th><th>年齢</th>
            <th>確認書類</th><th>古物の特徴</th>
            <th>記録要否</th><th>保存期限</th>

          <tbody>
            ${records.map(p => {
              const v = p.vendor || {};

                <td><span class="vendor-pill ${isCorp?'houjin':'kojin'}">${escapeHtml(v.type||'個人')}</span></td>
                <td>${name?escapeHtml(name):'<span class="text-mute">—</span>'}</td>
                <td>${v.address?escapeHtml(v.address):'<span class="text-mute">—</span>'}</td>
                <td>${v.occupation?escapeHtml(v.occupation):'<span class="text-mute">—</span>'}</td>
                <td>${v.age?escapeHtml(v.age):'<span class="text-mute">—</span>'}</td>
                <td>${v.docType?escapeHtml(v.docType)+(v.docNumber?' / '+escapeHtml(v.docNumber):''):'<span class="text-mute">—</span>'}</td>
                <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${v.feature?escapeHtml(v.feature):'<span class="text-mute">—</span>'}</td>
                <td>${required?'<span class="vendor-pill" style="background:#FBE9E1;color:#A04A14;">必須</span>':'<span class="vendor-pill" style="background:#F1F1F1;color:#888;">任意</span>'}</td>
                <td style="${limitStyle}">${fmtLimit(p)}${expired?' <small>(超過)</small>':''}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `}
  `;

  // 行クリック → 商品詳細
  root.querySelectorAll('tbody tr[data-id]').forEach(tr => {
    tr.addEventListener('click', () => openDetailPanel(tr.dataset.id));
  });
  // フィルターハンドラ
  const vfReq = document.getElementById('vfRequired');
  if(vfReq) vfReq.addEventListener('change', () => {
    state.vendorFilter.requiredOnly = vfReq.checked;
    renderVendorView();
  });
  const vfExp = document.getElementById('vfExpiring');
  if(vfExp) vfExp.addEventListener('change', () => {
    state.vendorFilter.expiringOnly = vfExp.checked;
    renderVendorView();
  });
  const btnExpOnly = document.getElementById('btnVendorExpiringOnly');
  if(btnExpOnly) btnExpOnly.addEventListener('click', () => {
    state.vendorFilter.expiringOnly = true;
    renderVendorView();
  });
  const btnBulk = document.getElementById('btnVendorBulkDelete');
  if(btnBulk) btnBulk.addEventListener('click', () => autoCleanExpiredProducts());
}

/* ===========================================================
   v6.1: 保存期限自動削除関連
   - getExpiredProducts: 入荷日から3年経過 かつ 在庫中以外
   - autoCleanExpiredProducts: CSV出力→確認→削除のフロー
   - confirmAndDelete: 最終確認後に削除
   - exportExpiredCsv: 既存 exportCsv と同じフォーマットで期限切れ分のみ出力
   =========================================================== */
function getExpiredProducts(){
  const THREE_YEARS_MS = 3 * 365 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  return state.products.filter(p => {
    if(!p.date) return false;
    if(isInStock(p)) return false;  // v6.4: 出品中も削除対象外
    const t = new Date(p.date).getTime();
    if(isNaN(t)) return false;
    return (now - t) >= THREE_YEARS_MS;
  });
}

function autoCleanExpiredProducts(){
  const expired = getExpiredProducts();
  if(expired.length === 0){
    toast('期限切れの商品はありません', 'success');
    return;
  }
  const doExport = confirm(
    `保存期限（3年）を超過した商品が ${expired.length} 件あります。\n` +
    `削除前にCSVファイルをダウンロードしますか？\n` +
    `（「OK」でダウンロード後に削除確認、「キャンセル」で今回はスキップ）`
  );
  if(doExport){
    exportExpiredCsv(expired);
    setTimeout(() => confirmAndDelete(expired), 500);
  }else{
    confirmAndDelete(expired);
  }
}

function confirmAndDelete(expired){
  const ok = confirm(
    `期限超過の ${expired.length} 件を削除してもよいですか？\n` +
    `（この操作は取り消せません）`
  );
  if(!ok) return;
  const expiredIds = new Set(expired.map(p => p.id));
  state.products = state.products.filter(p => !expiredIds.has(p.id));
  saveProducts();
  toast(`期限切れ ${expired.length} 件を削除しました`, 'success');
  renderTable();
  if(state.currentView === 'vendor') renderVendorView();
}

function exportExpiredCsv(products){
  if(!products || products.length === 0) return;
  const headers = ['管理番号','商品名','部門','棚番号','ランク','入荷日','仕入価格','状態','ステータス','販路','販売日','売上価格','粗利','備考'];
  const rows = products.map(p => {
    const cat = CATS_MAP[p.cat]; const catName = cat ? cat.name : p.cat;
    const profit = (p.salePrice!=='' && p.cost!=='') ? (Number(p.salePrice)-Number(p.cost)) : '';
    return [p.id, p.name||'', `${p.cat||''} ${catName||''}`.trim(), p.shelf||'', p.rank||'', p.date||'', p.cost??'', p.cond||'', p.status||'', p.channel||'', p.saleDate||'', p.salePrice??'', profit, p.desc||''];
  });
  const esc = v => {
    const s = (v==null?'':String(v));
    if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  const csv = [headers, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
  const bom = '﻿';
  const blob = new Blob([bom+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const ymd = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  a.href = url; a.download = `期限超過商品_${ymd}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('期限超過商品のCSVを出力しました', 'success');
}

const IMPORT_FIELD_LABELS = {
  id: '管理番号', date: '入荷日', cat: 'カテゴリ',
  name: '品名', rank: 'ランク', shelf: '棚番号',
  status: 'ステータス', desc: '備考', channel: '販売先',
};

/* 仕様書15章「ステータス・販路の自動変換」 */
function normalizeImportStatus(raw){
  const v = String(raw||'').trim();
  if(!v) return '在庫中';
  if(v.includes('売上確定')) return '販売済';
  if(v.includes('キャンセル') || v.includes('返品')) return 'キャンセル・返品';
  if(v.includes('出品中')) return '出品中';  // v6.4: 出品中を保持
  if(v.includes('出品前') || v.includes('選択式')) return '在庫中';
  // 既知のラベルがそのまま入っていればそれを採用
  if(v === '在庫中' || v === '出品中' || v === '販売済' || v === 'キャンセル・返品') return v;
  if(v === 'キャンセル') return 'キャンセル・返品';  // 旧形式の自動置換
  // それ以外は在庫中扱い
  return '在庫中';
}
function normalizeImportChannel(raw){
  const v = String(raw||'').trim();
  if(!v) return '';
  const low = v.toLowerCase();
  if(v.includes('メルカリ')) return 'メルカリ';
  if(v.includes('ヤフオク')) return 'ヤフオク';
  if(low.includes('ebay'))   return 'eBay';
  if(v.includes('その他'))   return 'その他';
  return v;
}

/* Excel日付値→ YYYY-MM-DD 文字列 */
function normalizeImportDate(raw){
  if(raw == null || raw === '') return '';
  // 数値（Excelシリアル日付）
  if(typeof raw === 'number' && isFinite(raw)){
    try {
      const d = XLSX.SSF.parse_date_code(raw);
      if(d && d.y){
        return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
      }
    } catch(e){}
  }
  const v = String(raw).trim();
  if(!v) return '';
  // 既に YYYY-MM-DD 形式
  let m = v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m){
    return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  }
  // YY/MM/DD 形式
  m = v.match(/^(\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m){
    const yy = parseInt(m[1],10);
    const y = yy >= 50 ? 1900+yy : 2000+yy;
    return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  }
  return v;
}

/* 棚番号の正規化：数値のみ（YYYYMMDD のような日付誤入力）は破棄 */
function normalizeImportShelf(raw){
  if(raw == null) return '';
  const v = String(raw).trim();
  if(!v) return '';
  // 数値のみは日付誤入力とみなして空にする（仕様書15章末尾）
  if(/^\d+(\.\d+)?$/.test(v)) return '';
  return v;
}

/* カテゴリ列の値からカテゴリコードを解決
   - 1文字の英字（A-Z）はそのまま採用
   - "S 食器" のような形式は先頭を採用
   - 部門名（食器・メディア…）から CATS_MAP を逆引き
   - 解決できなければ '' を返す（取り込み時は元値を残しつつ警告） */
function resolveImportCat(raw){
  if(raw == null) return '';
  const v = String(raw).trim();
  if(!v) return '';
  // 先頭1文字が CATS のコードか
  const head = v.charAt(0).toUpperCase();
  if(CATS_MAP[head]) return head;
  // 名前で逆引き
  const byName = CATS.find(c => v.includes(c.name) || v.includes(c.full));
  if(byName) return byName.code;
  return '';
}

/* ランク列の値からランクコードを解決
   - 既知のランクコードならそのまま
   - 大文字化して再判定
   - 解決できなければ '' */
function resolveImportRank(raw){
  if(raw == null) return '';
  const v = String(raw).trim();
  if(!v) return '';
  if(ALL_RANKS.includes(v)) return v;
  const upper = v.toUpperCase();
  if(ALL_RANKS.includes(upper)) return upper;
  // "特S" は半角全角混在ありうる
  if(v === '特S' || v === '特ｓ') return '特S';
  return '';
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* インポート画面のイベント配線 */
function wireImportEvents(){
  const dz = document.getElementById('impDropzone');
  const fi = document.getElementById('impFile');
  if(dz && fi){
    fi.addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      if(f) handleImportFile(f);
    });
    ['dragenter','dragover'].forEach(ev => {
      dz.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dz.classList.add('drag'); });
    });
    ['dragleave','drop'].forEach(ev => {
      dz.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dz.classList.remove('drag'); });
    });
    dz.addEventListener('drop', e => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) handleImportFile(f);
    });
  }

  const clr = document.getElementById('impClearFile');
  if(clr) clr.addEventListener('click', () => {
    state.importDraft = null;
    renderImportView();
  });

  document.querySelectorAll('#viewImport input[data-mapcol]').forEach(inp => {
    inp.addEventListener('change', () => {
      const key = inp.dataset.mapcol;
      const v = parseInt(inp.value, 10);
      if(isFinite(v) && v >= 1) state.importDraft.mapping.cols[key] = v;
    });
  });
  const hdr = document.getElementById('impMapHeader');
  if(hdr) hdr.addEventListener('change', () => {
    const v = parseInt(hdr.value, 10);
    if(isFinite(v) && v >= 1) state.importDraft.mapping.headerRow = v;
  });

  const rst = document.getElementById('impMapReset');
  if(rst) rst.addEventListener('click', () => {
    state.importDraft.mapping = JSON.parse(JSON.stringify(IMPORT_DEFAULT_MAPPING));
    state.importDraft.parsed = null;
    renderImportView();
  });

  const pv = document.getElementById('impPreview');
  if(pv) pv.addEventListener('click', () => {
    parseImportPreview();
    renderImportView();
  });
}

/* Excelファイルを読み込み → state.importDraft.rows に格納 */
function handleImportFile(file){
  const name = file.name || '';
  if(!/\.(xlsx|xls)$/i.test(name)){
    toast('対応していないファイル形式です（.xlsx / .xls のみ）', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: false });
      const sheetName = wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      // 全行を生の配列で取得（header:1 → 2次元配列）
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      state.importDraft.fileName = name;
      state.importDraft.sheetName = sheetName;
      state.importDraft.rows = rows;
      state.importDraft.parsed = null;
      toast(`「${name}」を読み込みました（${rows.length}行）`, 'success');
      renderImportView();
    }catch(err){
      console.error('[import] parse failed', err);
      toast('Excelファイルの読み込みに失敗しました', 'error');
    }
  };
  reader.onerror = () => toast('ファイル読み込みエラー', 'error');
  reader.readAsArrayBuffer(file);
}

/* マッピングに沿って rows → 商品オブジェクト配列 を生成（プレビュー用） */
function parseImportPreview(){
  const d = state.importDraft;
  if(!d || !d.rows){ toast('先にファイルを選択してください', 'warn'); return; }
  const m = d.mapping;
  const valid = [];
  const skipped = [];
  const existingIds = new Set(state.products.map(p => p.id));
  const seenIds = new Set();
  const duplicates = []; // 取り込み対象内での重複id
  const conflictsWithExisting = []; // 既存と重複するid

  // ヘッダー行（1始まり）以降をデータ行として処理
  const startIdx = Math.max(0, m.headerRow); // 0始まり配列でヘッダー次行
  for(let i = startIdx; i < d.rows.length; i++){
    const row = d.rows[i] || [];
    const idRaw = row[m.cols.id - 1];
    if(idRaw == null || String(idRaw).trim() === ''){
      // 完全空行はスキップ（カウントしない）
      const allBlank = row.every(v => v==null || String(v).trim()==='');
      if(allBlank) continue;
      skipped.push({rowNum: i+1, reason: '管理番号が空欄'});
      continue;
    }
    const idStr = String(idRaw).trim();
    if(!idStr.startsWith('FC-')){
      skipped.push({rowNum: i+1, reason: `管理番号が FC- で始まらない: ${idStr}`});
      continue;
    }
    // 重複検出
    if(seenIds.has(idStr)){
      duplicates.push(idStr);
    }
    seenIds.add(idStr);
    if(existingIds.has(idStr)){
      conflictsWithExisting.push(idStr);
    }

    const dateRaw = row[m.cols.date - 1];
    const date = normalizeImportDate(dateRaw);
    const catRaw = row[m.cols.cat - 1];
    const cat = resolveImportCat(catRaw);
    const nameRaw = row[m.cols.name - 1];
    const name = String(nameRaw==null?'':nameRaw).trim();
    const rankRaw = row[m.cols.rank - 1];
    const rank = resolveImportRank(rankRaw);
    const shelfRaw = row[m.cols.shelf - 1];
    const shelf = normalizeImportShelf(shelfRaw);
    const statusRaw = row[m.cols.status - 1];
    const status = normalizeImportStatus(statusRaw);
    const descRaw = row[m.cols.desc - 1];
    const desc = String(descRaw==null?'':descRaw).trim();
    const chRaw = row[m.cols.channel - 1];
    const channel = normalizeImportChannel(chRaw);

    valid.push({
      _rowNum: i+1,
      _conflict: existingIds.has(idStr),
      _dup: false, // 後で重複判定をマーク
      id: idStr,
      name,
      brand: '',
      model: '',
      cat,
      _catRaw: String(catRaw==null?'':catRaw),
      rank,
      _rankRaw: String(rankRaw==null?'':rankRaw),
      shelf,
      date,
      cost: '',
      cond: '',
      status,
      channel,
      saleDate: status === '販売済' ? date : '',
      salePrice: '',
      desc,
      vendor: {},
      createdAt: new Date().toISOString(),
    });
  }
  // 重複（同一ファイル内で同じID）を後段でマーク
  const dupSet = new Set(duplicates);
  valid.forEach(v => { if(dupSet.has(v.id)) v._dup = true; });

  d.parsed = {
    valid,
    skipped,
    conflictsWithExisting,
    duplicates: [...dupSet],
  };
}

  // プレビューテーブル（先頭10件）

  tableHtml += '<thead><tr>';

  tableHtml += '</tr></thead><tbody>';
  preview.forEach(p => {
    const trCls = p._conflict && d.mode==='add' ? 'skip' : (p._dup ? 'dup' : '');
    const catCell = p.cat
      ? `${p.cat} (${(CATS_MAP[p.cat]||{}).name||''})`
      : `<span class="cell-warn">未解決: ${escapeHtml(p._catRaw)}</span>`;
    const rankCell = p.rank
      ? p.rank
      : `<span class="cell-warn">未解決: ${escapeHtml(p._rankRaw)}</span>`;
    tableHtml += `<tr class="${trCls}">`;
    tableHtml += `<td>${p._rowNum}</td>`;
    tableHtml += `<td>${escapeHtml(p.id)}</td>`;
    tableHtml += `<td>${escapeHtml(p.date)}</td>`;
    tableHtml += `<td>${catCell}</td>`;
    tableHtml += `<td>${escapeHtml(p.name)}</td>`;
    tableHtml += `<td>${rankCell}</td>`;
    tableHtml += `<td>${escapeHtml(p.shelf)}</td>`;
    tableHtml += `<td>${escapeHtml(p.status)}</td>`;
    tableHtml += `<td>${escapeHtml(p.channel)}</td>`;
    tableHtml += `<td>${escapeHtml(p.desc)}</td>`;
    tableHtml += '</tr>';
  });
  if(preview.length === 0){
    tableHtml += '<tr><td colspan="10" style="padding:20px;text-align:center;color:var(--text-mute);">取り込み候補がありません（マッピングを確認してください）</td></tr>';
  }
  tableHtml += '</tbody></table></div>';
  if(v.length > 10){
    tableHtml += `<div style="font-size:11.5px;color:var(--text-mute);margin-top:6px;">…他 ${v.length - 10} 件（プレビューは先頭10件のみ）</div>`;
  }

  // スキップ理由（先頭5件まで）
  let skippedHtml = '';
  if(sk.length > 0){
    const sample = sk.slice(0, 5);
    skippedHtml = '<div class="map-hint" style="margin-top:12px;"><strong>スキップ理由（先頭' + sample.length + '件）:</strong><ul style="margin:6px 0 0 18px;padding:0;">'
      + sample.map(x => `<li>${x.rowNum}行目: ${escapeHtml(x.reason)}</li>`).join('')

  // 取り込みボタン

      </button>
      <span class="ia-note">${d.mode==='replace' ? '⚠ 既存データはすべて削除されます' : '既存データは保持され、新規分のみ追加されます'}</span>
    </div>

  body.innerHTML = summaryHtml + modeHtml + tableHtml + skippedHtml + actionsHtml;

  // モード切替
  body.querySelectorAll('.mode-tile').forEach(t => {
    t.addEventListener('click', () => {
      state.importDraft.mode = t.dataset.mode;
      renderImportPreview();
    });
  });
  // 実行
  const exe = document.getElementById('impExecute');
  if(exe) exe.addEventListener('click', executeImport);
}

/* インポート実行 */
function executeImport(){
  const d = state.importDraft;
  if(!d || !d.parsed){ return; }
  const valid = d.parsed.valid;
  if(valid.length === 0){ toast('取り込めるデータがありません', 'warn'); return; }

  if(d.mode === 'replace'){
    const ok = confirm(`既存 ${state.products.length} 件をすべて削除して ${valid.length} 件に置き換えます。\nこの操作は取り消せません。本当に実行しますか？`);
    if(!ok) return;
    // 内部用フィールド (_rowNum, _conflict, _dup, _catRaw, _rankRaw) を除去
    state.products = valid.map(stripImportMeta);
    saveProducts();
    toast(`置き換え完了：${state.products.length}件`, 'success');
  }else{
    // 追加モード：既存と重複しない件のみ追加
    const existingIds = new Set(state.products.map(p => p.id));
    let added = 0, skipped = 0;
    valid.forEach(v => {
      if(existingIds.has(v.id)){ skipped++; return; }
      state.products.push(stripImportMeta(v));
      existingIds.add(v.id);
      added++;
    });
    saveProducts();
    toast(`追加：${added}件 / スキップ（既存と重複）：${skipped}件`, 'success');
  }

  // 商品台帳を再描画（次回 ledger 切替時にも反映されるよう updateFilterCount 等も呼ぶ）
  try{ populateFilters(); }catch(e){}
  try{ renderTable(); }catch(e){}

  // インポート画面をリセット
  state.importDraft = null;
  renderImportView();
}

/* インポート内部メタを除去して保存形式に整形 */
function stripImportMeta(p){
  const out = {};
  for(const k in p){
    if(k.startsWith('_')) continue;
    out[k] = p[k];
  }
  return out;
}



/* ===========================================================
   ===== フェーズ3-(B): GAS方式 Google Sheets連携（仕様書16章） =====

   設計上の前提：
   - フェーズ1〜2の関数（loadData / saveProducts / saveInv / renderTable 等）
     および定数（LS_LEDGER / LS_INV / CATS / RANK_T ...）は一切変更しない。
   - 接続情報は localStorage の別キー（fc_gas_url）に保存。
     fc_ledger_v3 / fc_inv_v3 は触らない。
   - クロスオリジンCORS問題を避けるため、POST は Content-Type 未指定
     （text/plain扱い）で JSON 文字列を送信。GAS側は e.postData.contents
     を JSON.parse で取り出す。
   - 「デュアル保存モード」ON時：saveProducts/saveInv をモンキーパッチして
     ローカル保存後にGASへも自動送信。本宣言は無変更。
   =========================================================== */

const LS_SHELVES = 'fc_shelves_v1';   // v6.3: 棚マスタ
const LS_GAS = 'fc_gas_url';

/* ========== 設定の localStorage 永続化 ========== */
function loadGasConfig(){
  try{
    const raw = localStorage.getItem(LS_GAS);
    if(raw){
      const obj = JSON.parse(raw);
      if(obj && typeof obj === 'object'){
        state.gas.url        = obj.url        || '';
        state.gas.secret     = obj.secret     || '';
        state.gas.dualMode   = !!obj.dualMode;
        state.gas.lastSyncAt = obj.lastSyncAt || null;
      }
    }
  }catch(e){ console.warn('[gas] loadConfig failed', e); }
}
function saveGasConfig(){
  try{
    localStorage.setItem(LS_GAS, JSON.stringify({
      url: state.gas.url,
      secret: state.gas.secret,
      dualMode: state.gas.dualMode,
      lastSyncAt: state.gas.lastSyncAt,
    }));
  }catch(e){ console.warn('[gas] saveConfig failed', e); }
}

/* ========== ログ ========== */
function gasLog(msg, kind=''){
  const ts = new Date().toLocaleTimeString('ja-JP', {hour12:false});
  state.gas.log.unshift({ts, msg, kind});
  if(state.gas.log.length > 80) state.gas.log.length = 80;

  if(el) el.innerHTML = state.gas.log.map(e =>
    `<div class="log-row ${e.kind||''}">[${e.ts}] ${escapeHtml(e.msg)}</div>`
  ).join('');
  console.log('[gas]', msg);
}

/* ========== GAS API クライアント ==========
   - GET: URLクエリで action + secret を渡す
   - POST: bodyに action/secret/data を含むJSONを text/plain で送信
*/
async function gasCall(action, payload, method){
  if(!state.gas.url){
    throw new Error('GASデプロイURLが未設定です');
  }
  method = method || 'GET';
  const url = state.gas.url;
  let r;
  if(method === 'GET'){
    const qs = new URLSearchParams({ action, secret: state.gas.secret || '' });
    if(payload && typeof payload === 'object'){
      // GETでもidなどの単純な値は付与可能
      for(const k in payload){
        if(typeof payload[k] === 'string' || typeof payload[k] === 'number'){
          qs.set(k, payload[k]);
        }
      }
    }
    r = await fetch(url + (url.includes('?')?'&':'?') + qs.toString(), {
      method: 'GET', redirect: 'follow',
    });
  }else{
    // POST：Content-Type を指定せずに body 送信（CORS preflight 回避）
    const body = JSON.stringify({
      action,
      secret: state.gas.secret || '',
      data: payload == null ? null : payload,
    });
    r = await fetch(url, {
      method: 'POST', redirect: 'follow', body,
    });
  }
  if(!r.ok){
    const t = await r.text();
    throw new Error(`HTTP ${r.status}: ${t.slice(0,200)}`);
  }
  const text = await r.text();
  let j;
  try { j = JSON.parse(text); }
  catch(e){
    // GASがHTMLエラーページを返した場合（デプロイURL誤り・実行権限など）
    throw new Error('GASから不正な応答（HTMLが返されました）: ' + text.slice(0,120));
  }
  if(j.error){
    throw new Error(j.error);
  }
  return j.data;
}

/* 各エンドポイント */
const gasApi = {
  ping:           ()       => gasCall('ping', null, 'GET'),
  init:           ()       => gasCall('init', null, 'POST'),
  getAll:         ()       => gasCall('getAll', null, 'GET'),
  saveAll:        (arr)    => gasCall('saveAll', arr, 'POST'),
  addOne:         (p)      => gasCall('addOne', p, 'POST'),
  updateOne:      (p)      => gasCall('updateOne', p, 'POST'),
  deleteOne:      (id)     => gasCall('deleteOne', {id}, 'POST'),
  getInvChecked:  ()       => gasCall('getInvChecked', null, 'GET'),
  saveInvChecked: (obj)    => gasCall('saveInvChecked', obj, 'POST'),
  getInvScan:     ()       => gasCall('getInvScan', null, 'GET'),
  addInvScan:     (arr)    => gasCall('addInvScan', arr, 'POST'),
};

/* ========== 接続テスト ========== */
async function gasPing(){
  if(state.gas.busy){ toast('処理中です','warn'); return; }
  if(!state.gas.url){ toast('GASデプロイURLが未設定です','warn'); return; }
  state.gas.busy = true;
  try{
    gasLog('接続テスト中…');
    const r = await gasApi.ping();
    state.gas.connected = true;
    gasLog('接続成功（GAS応答: ' + JSON.stringify(r) + '）', 'ok');
    toast('GASへの接続に成功しました','success');
  }catch(e){
    state.gas.connected = false;
    gasLog('接続失敗: ' + e.message, 'err');
    toast('接続失敗: ' + e.message,'error');
  }finally{
    state.gas.busy = false;
    updateHeaderCloudStatus();
    if(state.currentView === 'settings') renderSettingsView();
  }
}

/* ========== デュアル保存モード（モンキーパッチ） ========== */
let _origSaveProducts = null;
let _origSaveInv = null;
let _gasSyncTimer = null;
const GAS_SYNC_DEBOUNCE_MS = 2000;

function gasCaptureOriginals(){
  if(_origSaveProducts) return;
  _origSaveProducts = window.saveProducts;
  _origSaveInv = window.saveInv;
}

function gasInstallDualPatch(){
  gasCaptureOriginals();
  window.saveProducts = function(){
    // 必ずローカル（localStorage）に保存（ネット断でもデータ消失しない）
    _origSaveProducts.apply(this, arguments);
    if(state.gas.dualMode && state.gas.url){
      scheduleGasSync('products');
    }
  };
  window.saveInv = function(){
    _origSaveInv.apply(this, arguments);
    if(state.gas.dualMode && state.gas.url){
      scheduleGasSync('inv');
    }
  };
}

function scheduleGasSync(kind){
  if(_gasSyncTimer) clearTimeout(_gasSyncTimer);
  _gasSyncTimer = setTimeout(async () => {
    _gasSyncTimer = null;
    try{
      if(kind === 'products' || kind === 'all'){
        await gasApi.saveAll(state.products);
      }
      if(kind === 'inv' || kind === 'all'){
        const ids = Object.keys(state.invChecked).filter(k => state.invChecked[k]);
        const obj = {}; ids.forEach(id => obj[id] = true);
        await gasApi.saveInvChecked(obj);
      }
      state.gas.lastSyncAt = new Date().toISOString();
      saveGasConfig();
      gasLog(`自動同期完了（${kind}）`, 'ok');
      updateHeaderCloudStatus();
    }catch(e){
      gasLog('自動同期エラー: ' + e.message, 'err');
    }
  }, GAS_SYNC_DEBOUNCE_MS);
}

  const el = document.getElementById('headerCloudStatus');
  const txt = document.getElementById('headerCloudStatusText');
  if(!el || !txt) return;
  el.classList.remove('ok','warn');
  const icon = el.querySelector('.ti');
  if(!state.gas.url){
    el.classList.add('warn');
    if(icon) icon.className = 'ti ti-cloud-off';
    txt.textContent = '未設定';
  }else if(!state.gas.connected){
    el.classList.add('warn');
    if(icon) icon.className = 'ti ti-cloud-question';
    txt.textContent = '未接続';
  }else if(state.gas.dualMode){
    el.classList.add('ok');
    if(icon) icon.className = 'ti ti-cloud-check';
    txt.textContent = 'デュアル保存ON';
  }else{
    el.classList.add('ok');
    if(icon) icon.className = 'ti ti-cloud';
    txt.textContent = '接続済み';
  }
}

    state.gas.secret = sec;
    state.gas.connected = false; // 再認証が必要
    saveGasConfig();
    gasLog('接続情報を保存しました');
    toast('保存しました','success');
    updateHeaderCloudStatus();
    renderSettingsView();
  });
  const ping = document.getElementById('cfgPing');
  if(ping) ping.addEventListener('click', gasPing);
  const init = document.getElementById('cfgInitSheets');

  if(dm) dm.addEventListener('change', () => {
    state.gas.dualMode = dm.checked;
    saveGasConfig();
    if(dm.checked){
      gasLog('デュアル保存モード ON', 'ok');
      toast('デュアル保存モードをONにしました','success');
    }else{
      gasLog('デュアル保存モード OFF');
      toast('デュアル保存モードをOFFにしました');
    }
    updateHeaderCloudStatus();
  });
}



/* ===========================================================
   ===== v6.3: 棚マスタ管理（府中センター棚住所体系） =====
   棚QR形式: SHELF|<棚コード>
   例:       SHELF|FC-S-03-01-03
   localStorage キー: fc_shelves_v1（既存LSキーには触れない）
   =========================================================== */

const SHELF_AREA_NAMES = {
  'S': '販売',
  'N': '北側',
  'A': '変更不可',
};

  }
}

    }

/* 棚QRペイロード生成 */
function buildShelfQRPayload(shelf){
  return 'SHELF|' + (shelf.code || '');
}

/* 棚コード → エリア記号 抽出（FC-S-03-01-03 → 'S'） */
function shelfAreaOf(code){
  if(!code) return '';
  const m = String(code).match(/^FC-([SNA])-/);
  return m ? m[1] : '';
}
function shelfIsGolden(level){
  // 段03・段04 がゴールデンゾーン
  const n = parseInt(String(level||'').replace(/\D/g,''),10);
  return n === 3 || n === 4;
}

          </tr></thead>

}

function wireShelvesEvents(){
  const fz = document.getElementById('shelfDropzone');
  const fi = document.getElementById('shelfFile');
  if(fi) fi.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if(f) handleShelfImport(f);
  });
  if(fz){
    ['dragenter','dragover'].forEach(ev => fz.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); fz.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev => fz.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); fz.classList.remove('drag'); }));
    fz.addEventListener('drop', e => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) handleShelfImport(f);
    });
  }
  const fa = document.getElementById('shelfFilterArea');
  if(fa) fa.addEventListener('change', () => { state.shelvesFilter.area = fa.value; renderShelvesView(); });
  const fg = document.getElementById('shelfFilterGolden');
  if(fg) fg.addEventListener('change', () => { state.shelvesFilter.goldenOnly = fg.checked; renderShelvesView(); });
  const fq = document.getElementById('shelfQuery');
  if(fq) fq.addEventListener('input', () => { state.shelvesFilter.query = fq.value; renderShelvesView(); });
  const cl = document.getElementById('shelfClearAll');
  if(cl) cl.addEventListener('click', () => {
    if(!confirm('棚マスタを全削除します。元に戻せません。実行しますか？')) return;
    state.shelves = [];
    saveShelves();
    toast('棚マスタを全削除しました');
    renderShelvesView();
  });
  const ec = document.getElementById('shelfExportCsv');
  if(ec) ec.addEventListener('click', exportShelvesCsv);
  const pb = document.getElementById('shelfPrintBulk');
  if(pb) pb.addEventListener('click', () => {
    const f = state.shelvesFilter;
    let list = [...state.shelves];
    if(f.area) list = list.filter(x => shelfAreaOf(x.code) === f.area);
    if(f.goldenOnly) list = list.filter(x => shelfIsGolden(x.level));
    if(f.query){
      const q = f.query.toLowerCase();
      list = list.filter(x => (x.code||'').toLowerCase().includes(q) || (x.note||'').toLowerCase().includes(q));
    }
    askShelfPrintLayout(list);
  });
  document.querySelectorAll('#viewShelves [data-print]').forEach(b => {
    b.addEventListener('click', () => {
      const code = b.dataset.print;
      const shelf = state.shelves.find(x => x.code === code);
      if(shelf) printShelfLabels([shelf], 1);
    });
  });
  document.querySelectorAll('#viewShelves [data-del]').forEach(b => {
    b.addEventListener('click', () => {
      const code = b.dataset.del;
      if(!confirm('棚 ' + code + ' を削除しますか？')) return;
      state.shelves = state.shelves.filter(x => x.code !== code);
      saveShelves();
      renderShelvesView();
    });
  });
}

/* ===========================================================
   Excel 取込（採番マスターシート対応）
   - 「📍採番マスター」のようにシート名で検出、失敗時は全シート走査
   - 「棚住所」を含むヘッダー行を見つけて以降をデータ行として処理
   =========================================================== */
function handleShelfImport(file){
  if(!/\.(xlsx|xls)$/i.test(file.name||'')){
    toast('対応していないファイル形式です（.xlsx / .xls のみ）','error');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: false });
      // 採番マスターのシートを優先的に検出
      let targetSheet = null;
      for(const name of wb.SheetNames){
        if(name.includes('採番マスター')){ targetSheet = name; break; }
      }
      if(!targetSheet) targetSheet = wb.SheetNames[0];

      const ws = wb.Sheets[targetSheet];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });

      // ヘッダー行の検出（厳格化版）
      // 「棚住所」を含むセル AND 「エリア」を含むセル の両方が同行に必要。
      // これにより、タイトル行の「合計235番地」のような誤検出を防ぐ。
      let headerRow = -1;
      let cols = { id:-1, area:-1, col:-1, row:-1, level:-1, note:-1 };
      for(let i = 0; i < Math.min(rows.length, 25); i++){
        const r = rows[i] || [];
        const headers = r.map(v => String(v||'').trim());
        // 「棚住所」「棚コード」「番地」の単語でかつ短いセル（タイトル混入を回避）
        const idxId = headers.findIndex(h =>
          h === '棚住所' || h === '棚住所（番地）' || h === '棚コード' || h === '番地' ||
          (h.length <= 12 && (h.startsWith('棚住所') || h.startsWith('番地')))
        );
        // 「エリア」が短いセルで存在
        const idxArea = headers.findIndex(h =>
          h === 'エリア' || (h.length <= 8 && h.startsWith('エリア'))
        );
        if(idxId >= 0 && idxArea >= 0){
          headerRow = i;
          cols.id    = idxId;
          cols.area  = idxArea;
          cols.col   = headers.findIndex(h => h === '列' || (h.length <= 8 && h.startsWith('列')));
          cols.row   = headers.findIndex(h => h === '行' || (h.length <= 8 && h.startsWith('行')));
          cols.level = headers.findIndex(h => h === '段' || (h.length <= 8 && h.startsWith('段')));
          cols.note  = headers.findIndex(h => h === '備考' || (h.length <= 8 && h.startsWith('備考')));
          break;
        }
      }

      if(headerRow === -1){
        toast('「棚住所」と「エリア」のヘッダー行が同じ行に見つかりません。採番マスターシートの構成をご確認ください。','error');
        return;
      }

      // データ行を抽出
      const parsed = [];
      for(let i = headerRow + 1; i < rows.length; i++){
        const r = rows[i] || [];
        const code = String(r[cols.id]||'').trim();
        if(!code.startsWith('FC-')) continue;
        parsed.push({
          code,
          area:  cols.area>=0  ? String(r[cols.area]||'').trim()  : '',
          col:   cols.col>=0   ? String(r[cols.col]||'').trim()   : '',
          row:   cols.row>=0   ? String(r[cols.row]||'').trim()   : '',
          level: cols.level>=0 ? String(r[cols.level]||'').trim() : '',
          note:  cols.note>=0  ? String(r[cols.note]||'').trim()  : '',
        });
      }

      if(parsed.length === 0){
        toast('FC- で始まる棚コードが見つかりませんでした','warn');
        return;
      }

      const ok = confirm(
        'シート「' + targetSheet + '」から ' + parsed.length + ' 件の棚を読み込みました。\n' +
        '現在のマスタ ' + state.shelves.length + ' 件 → 取込後 ' + parsed.length + ' 件 に置き換えます。\n' +
        '実行しますか？'
      );
      if(!ok) return;

      state.shelves = parsed;
      saveShelves();
      toast('棚マスタを ' + parsed.length + ' 件取り込みました','success');
      renderShelvesView();
    }catch(err){
      console.error('[shelves import] failed', err);
      toast('取込に失敗: ' + (err.message||err),'error');
    }
  };
  reader.onerror = () => toast('ファイル読込エラー','error');
  reader.readAsArrayBuffer(file);
}

/* 棚マスタ CSV出力（簡易バックアップ用） */
function exportShelvesCsv(){
  if(state.shelves.length === 0){ toast('棚マスタが空です','warn'); return; }
  const headers = ['棚コード','エリア','列','行','段','備考'];
  const rows = state.shelves.map(x => [x.code, x.area||'', x.col||'', x.row||'', x.level||'', x.note||'']);
  const esc = v => {
    const s = (v==null?'':String(v));
    if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  const csv = [headers, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
  const bom = '﻿';
  const blob = new Blob([bom+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const ymd = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  a.href = url; a.download = `棚マスタ_${ymd}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('棚マスタCSVを出力しました','success');
}

/* ===========================================================
   棚QRラベル印刷
   - レイアウト: 1棚/4棚/8棚/12棚 per A4
   - QR本体は qrcode-generator + Canvas で描画（既存QR実装と同じ）
   =========================================================== */
function askShelfPrintLayout(list){
  if(!list || list.length === 0){ toast('印刷対象がありません','warn'); return; }
  const choices = [
    { v:1,  label:'1棚 / A4（大）— 単独ラベル' },
    { v:4,  label:'4棚 / A4（中）— 2×2グリッド' },
    { v:8,  label:'8棚 / A4（小）— 2×4グリッド' },
    { v:12, label:'12棚 / A4（極小）— 3×4グリッド' },
  ];
  let msg = '印刷レイアウトを選んでください（番号を入力）:\n';
  choices.forEach((c,i) => { msg += '  ' + (i+1) + ') ' + c.label + '\n'; });
  msg += '\n対象: ' + list.length + ' 件';
  const inp = prompt(msg, '2');
  if(inp == null) return;
  const sel = parseInt(inp, 10);
  if(!sel || sel < 1 || sel > choices.length){ toast('番号が不正です','warn'); return; }
  printShelfLabels(list, choices[sel-1].v);
}

function printShelfLabels(shelves, perPage){
  if(!shelves || shelves.length === 0){ toast('印刷対象がありません','warn'); return; }
  perPage = perPage || 4;

  // ページ分割
  const pages = [];
  for(let i = 0; i < shelves.length; i += perPage){
    pages.push(shelves.slice(i, i + perPage));
  }

  // グリッド設定
  const gridMap = {
    1:  { cols:1, qrSize:380, fontCode:32, fontNote:14, padding:'40px' },
    4:  { cols:2, qrSize:240, fontCode:20, fontNote:11, padding:'18px' },
    8:  { cols:2, qrSize:170, fontCode:15, fontNote:10, padding:'12px' },
    12: { cols:3, qrSize:140, fontCode:13, fontNote:9,  padding:'10px' },
  };
  const g = gridMap[perPage] || gridMap[4];

  // 印刷ウィンドウを開く
  const w = window.open('', '_blank', 'width=1000,height=800');
  if(!w){ toast('ポップアップがブロックされました（許可してください）','error'); return; }

  // QR Canvas 描画 → DataURL を取得して img として埋め込む
  // qrcode-generator を使うため、ペイロードごとに Canvas を作成
  const qrImgs = shelves.map(sh => {
    try{
      const payload = buildShelfQRPayload(sh);
      const cv = document.createElement('canvas');
      drawQRToCanvas(cv, payload, g.qrSize);
      return cv.toDataURL('image/png');
    }catch(e){
      console.error('shelf QR error', sh, e);
      return '';
    }
  });

  // HTML 組み立て
  const labelHtml = (sh, dataUrl) => {
    const area = shelfAreaOf(sh.code);
    const golden = shelfIsGolden(sh.level);
    const areaLabel = SHELF_AREA_NAMES[area] || area;
    return `
      <div class="lbl" style="text-align:center;padding:${g.padding};border:2px solid #000;border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;break-inside:avoid;">
        <div style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:${g.fontCode}px;font-weight:900;letter-spacing:1px;margin-bottom:4px;">${sh.code}</div>
        <div style="font-size:${g.fontNote}px;color:#444;margin-bottom:8px;">
          ${areaLabel}エリア / 列${sh.col||'-'} / 行${sh.row||'-'} / ${sh.level||'-'}${golden?' ★':''}
        </div>
        <img src="${dataUrl}" style="width:${g.qrSize}px;height:${g.qrSize}px;display:block;" alt="${sh.code}">
        <div style="font-size:${Math.max(8,g.fontNote-1)}px;color:#888;margin-top:6px;font-family:Menlo,Consolas,monospace;">SHELF|${sh.code}</div>
      </div>`;
  };

  const pagesHtml = pages.map((pg, pi) => {
    const startIdx = pi * perPage;
    return `<div class="shelf-print-page" style="display:grid;grid-template-columns:repeat(${g.cols},1fr);gap:14px;padding:14px;width:100%;">
      ${pg.map((sh, si) => labelHtml(sh, qrImgs[startIdx + si])).join('')}
    </div>`;
  }).join('');

  w.document.write(`<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>棚QRラベル印刷</title>
<style>
  *{box-sizing:border-box;}
  @page{size:A4;margin:8mm;}
  body{margin:0;padding:0;font-family:-apple-system,sans-serif;background:#f5f5f5;}
  .toolbar{position:sticky;top:0;background:#fff;padding:10px;text-align:center;border-bottom:1px solid #ccc;z-index:10;}
  .toolbar button{padding:8px 20px;font-size:14px;cursor:pointer;border:1px solid #185FA5;background:#185FA5;color:#fff;border-radius:6px;}
  .shelf-print-page{background:#fff;margin:10mm auto;max-width:190mm;}
  @media print {
    .toolbar{display:none;}
    body{background:#fff;}
    .shelf-print-page{margin:0;page-break-after:always;}
    .shelf-print-page:last-child{page-break-after:auto;}
  }
</style></head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">この内容で印刷する</button>
    &nbsp;対象: ${shelves.length}件 / レイアウト: ${perPage}棚/A4 / ページ数: ${pages.length}
  </div>
  ${pagesHtml}
</body></html>`);
  w.document.close();
  // 印刷ダイアログは手動でユーザーが起動
}
