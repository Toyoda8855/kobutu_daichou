<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#185FA5">
<title>商品管理台帳 スキャン — 府中センター</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#185FA5;
  --primary-dark:#0F4A85;
  --primary-light:#E6F1FB;
  --accent:#FAEEDA;
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --border:#E2E5EA;
  --border-strong:#CBD0D8;
  --text:#1A2333;
  --text-sub:#5C6473;
  --text-mute:#8A93A2;
  --success:#1F9D55;
  --warning:#D97706;
  --danger:#DC2626;
  --hover:#F1EFE8;
  --shadow-sm:0 1px 2px rgba(20,30,50,.06);
  --shadow:0 4px 12px rgba(20,30,50,.08);
  --shadow-lg:0 12px 32px rgba(20,30,50,.16);
  --radius:10px;
  --radius-sm:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
  font-size:15px;
  color:var(--text);
  background:var(--bg);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input,select{font-family:inherit;font-size:16px;color:inherit;}
input:focus,select:focus{outline:none;}

/* ============= Layout ============= */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}

/* ============= Header ============= */
.header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:#fff;border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-sm);flex-shrink:0;z-index:30;
}
.brand{display:flex;align-items:center;gap:8px;flex:1;}
.brand-mark{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;
}
.brand-title{font-size:14px;font-weight:700;line-height:1.1;}
.brand-sub{font-size:10.5px;color:var(--text-mute);line-height:1.1;margin-top:2px;}
.cloud-pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:8px;font-size:11px;font-weight:600;
  background:var(--bg);color:var(--text-sub);
}
.cloud-pill.ok{background:#E7F5EC;color:#176939;}
.cloud-pill.warn{background:#FBEFD9;color:#A06B00;}
.cloud-pill .ti{font-size:13px;}
.icon-btn{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--text-sub);background:var(--bg);
}
.icon-btn:active{background:var(--border);}

/* ============= モードタブ ============= */
.mode-tabs{
  display:grid;grid-template-columns:1fr 1fr;
  background:#fff;border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:20;
}
.mode-tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:11px 4px 9px;
  font-size:13px;font-weight:700;color:var(--text-sub);
  border-bottom:3px solid transparent;
  min-height:56px;justify-content:center;
}
.mode-tab .ti{font-size:22px;}
.mode-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.mode-tab:active{background:var(--hover);}

/* ============= Main ============= */
.main{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
}

/* ============= Scanner ============= */
.scanner{
  position:relative;width:100%;
  aspect-ratio:1/1;
  background:#000;
  overflow:hidden;flex-shrink:0;
}
.scanner video{
  width:100%;height:100%;object-fit:cover;display:block;
}
.scanner .scan-frame{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:70%;aspect-ratio:1/1;
  border:3px solid rgba(255,255,255,.9);border-radius:14px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.35);
  pointer-events:none;
}
.scanner .scan-frame::before,
.scanner .scan-frame::after{
  content:'';position:absolute;width:18px;height:18px;
  border:4px solid var(--primary);
}
.scanner .scan-frame::before{top:-3px;left:-3px;border-right:none;border-bottom:none;border-top-left-radius:14px;}
.scanner .scan-frame::after{bottom:-3px;right:-3px;border-left:none;border-top:none;border-bottom-right-radius:14px;}
.scanner .scan-hint{
  position:absolute;left:0;right:0;bottom:14px;
  text-align:center;color:#fff;
  font-size:13px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.7);
  padding:0 20px;
}
.scanner.off{background:#1a1f2a;}
.scanner.off::after{
  content:'カメラOFF';
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:#5C6473;font-weight:700;letter-spacing:2px;
}

/* ============= ボタン ============= */
.camera-controls{
  display:flex;gap:8px;padding:12px 14px;background:#fff;
  border-bottom:1px solid var(--border);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:0 14px;height:48px;min-width:48px;
  border-radius:var(--radius);font-weight:700;font-size:14px;
  transition:.12s;flex:1;border:1px solid transparent;
}
.btn .ti{font-size:18px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-outline{background:#fff;color:var(--primary);border-color:var(--primary);}
.btn-outline:active{background:var(--primary-light);}
.btn-ghost{background:var(--bg);color:var(--text-sub);}
.btn-ghost:active{background:var(--border);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:active{background:#B91C1C;}
.btn:disabled{opacity:.5;}
.btn-sm{height:38px;font-size:12.5px;padding:0 10px;}

/* ============= 照会結果パネル ============= */
.result-panel{padding:14px;}
.result-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow-sm);
}
.result-empty{
  padding:36px 16px;text-align:center;color:var(--text-mute);font-size:13px;
}
.result-empty .ti{font-size:40px;display:block;margin-bottom:8px;color:var(--text-mute);}
.result-id{
  font-family:Menlo,Consolas,monospace;font-size:13px;font-weight:700;
  color:var(--text);margin-bottom:6px;
}
.result-name{font-size:18px;font-weight:700;line-height:1.3;margin-bottom:4px;}
.result-brand{font-size:13px;color:var(--text-sub);margin-bottom:10px;}
.result-grid{
  display:grid;grid-template-columns:auto 1fr;gap:6px 12px;
  font-size:13.5px;margin-top:10px;
}
.result-grid dt{color:var(--text-sub);font-weight:600;}
.result-grid dd{margin:0;color:var(--text);}
.result-grid dd.cost{font-weight:700;font-family:Menlo,Consolas,monospace;}
.status-bar{
  display:inline-block;padding:5px 12px;border-radius:8px;
  font-weight:700;font-size:13px;margin-bottom:10px;
}
.status-bar.zaiko{background:#EAF3DE;color:#3F6F1F;}
.status-bar.hanbai{background:#E6F1FB;color:#155A99;}
.status-bar.cancel{background:#F1EFE8;color:#6B6E73;}
.status-bar.shuppin{background:#FBEFD9;color:#7A5A00;}  /* v6.4: 出品中 */
.result-error{
  background:#FBEFEF;border:1px solid #F0C9C9;color:#A02020;
  padding:14px 16px;border-radius:var(--radius);
}
.result-error .ti{font-size:22px;vertical-align:middle;margin-right:6px;}
.result-time{font-size:11px;color:var(--text-mute);margin-top:10px;text-align:right;}

/* ============= 棚卸スキャンパネル ============= */
/* ===== 棚コンテキストカード (v6.3) ===== */
.shelf-ctx{
  background:#fff;padding:12px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.shelf-ctx.set{background:linear-gradient(180deg,#E6F1FB,#fff);border-bottom:2px solid var(--primary);}
.shelf-ctx.unset{background:#FFF8E1;border-bottom:2px solid var(--warning);}
.shelf-ctx .ti-pin{font-size:30px;color:var(--primary);}
.shelf-ctx.unset .ti-alert-circle{font-size:30px;color:var(--warning);}
.shelf-ctx .body{flex:1;min-width:0;}
.shelf-ctx .ttl{font-size:11px;font-weight:700;color:var(--text-sub);}
.shelf-ctx .code{font-size:18px;font-weight:700;font-family:Menlo,Consolas,monospace;line-height:1.1;}
.shelf-ctx .desc{font-size:11px;color:var(--text-mute);margin-top:2px;}
.shelf-ctx.unset .msg{font-size:13px;font-weight:700;color:#A06B00;}
.shelf-ctx .clear-btn{
  width:38px;height:38px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-sub);background:var(--bg);font-size:18px;
}

/* スキャンリスト内の棚切替セパレータ */
.shelf-sep{
  display:flex;align-items:center;gap:8px;
  background:#F1F8FE;color:var(--primary);
  padding:6px 14px;font-size:11.5px;font-weight:700;
  font-family:Menlo,Consolas,monospace;
  border-top:1px solid #C5DCEF;border-bottom:1px solid #C5DCEF;
}
.shelf-sep .ti{font-size:13px;}
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

.inv-stats{
  display:flex;align-items:center;justify-content:space-between;
  background:#fff;padding:12px 14px;border-bottom:1px solid var(--border);
  font-size:13px;color:var(--text-sub);font-weight:600;
}
.inv-stats strong{
  font-size:22px;color:var(--primary);margin:0 4px;font-family:Menlo,Consolas,monospace;
}
.inv-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding:10px 14px;background:#fff;border-bottom:1px solid var(--border);
}
.inv-actions .full{grid-column:1 / -1;}
.inv-actions .btn{flex:initial;}

.inv-list{
  list-style:none;margin:0;padding:0;background:var(--bg);
}
.inv-row{
  background:#fff;border-bottom:1px solid var(--border);
  padding:11px 14px;display:flex;gap:10px;align-items:flex-start;
}
.inv-row.uploaded{background:#F8FBF6;}
.inv-row .info{flex:1;min-width:0;}
.inv-row .info .id{
  font-family:Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:var(--text);
}
.inv-row .info .nm{font-size:13.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inv-row .info .meta{
  font-size:11px;color:var(--text-mute);margin-top:3px;
  display:flex;gap:8px;
}
.inv-row .info .meta .rk{font-family:Menlo,Consolas,monospace;font-weight:700;color:var(--text-sub);}
.inv-row .info .meta .up{color:var(--success);font-weight:700;}
.inv-row .del{
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--danger);background:#FBEFEF;font-size:18px;flex-shrink:0;
}
.inv-row .del:active{background:#F2D5D5;}

/* ============= Toast ============= */
.toast-container{
  position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 60px);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  z-index:200;pointer-events:none;
}
.toast{
  padding:11px 18px;border-radius:24px;
  background:rgba(20,30,50,.92);color:#fff;
  font-size:13.5px;font-weight:600;
  max-width:90%;text-align:center;
  animation:toastIn .25s ease-out;
  box-shadow:var(--shadow-lg);pointer-events:auto;
}
.toast.success{background:#176939;}
.toast.error{background:#B91C1C;}
.toast.warn{background:#A06B00;}
@keyframes toastIn{from{transform:translateY(-12px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* ============= 設定ドロワー ============= */
.scrim{
  position:fixed;inset:0;background:rgba(20,30,50,.5);
  opacity:0;pointer-events:none;transition:.2s;z-index:100;
}
.scrim.show{opacity:1;pointer-events:auto;}
.settings{
  position:fixed;left:0;right:0;bottom:0;
  background:#fff;border-radius:18px 18px 0 0;
  max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s ease;
  z-index:101;padding-bottom:env(safe-area-inset-bottom);
}
.settings.show{transform:translateY(0);}
.settings-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1;
}
.settings-head h3{font-size:16px;font-weight:700;margin:0;}
.settings-body{padding:14px 16px 30px;}
.field{margin-bottom:12px;}
.field label{
  display:block;font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:4px;
}
.field input{
  width:100%;height:42px;padding:0 12px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:#fff;font-size:14px;font-family:Menlo,Consolas,monospace;
}
.field .hint{font-size:11px;color:var(--text-mute);margin-top:3px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.btn-row .btn{flex:1;min-width:140px;}

.kv{
  display:grid;grid-template-columns:auto 1fr;gap:5px 12px;
  font-size:12.5px;margin:10px 0;
}
.kv dt{color:var(--text-sub);font-weight:600;}
.kv dd{margin:0;color:var(--text);}

.log{
  font-size:11px;color:var(--text-mute);margin-top:10px;
  font-family:Menlo,Consolas,monospace;line-height:1.4;
  max-height:160px;overflow-y:auto;
  padding:7px 10px;background:#FAFAF7;border-radius:7px;border:1px solid var(--border);
}
.log .log-row{padding:1px 0;}
.log .log-row.err{color:var(--danger);}
.log .log-row.ok{color:var(--success);}

.divider{
  height:1px;background:var(--border);margin:14px 0;
}
.section-title{
  font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;
}
</style>
</head>
<body>
<div class="app">

  <!-- ============= Header ============= -->
  <header class="header">
    <div class="brand">
      <div class="brand-mark"><i class="ti ti-qrcode"></i></div>
      <div>
        <div class="brand-title">スキャン</div>
        <div class="brand-sub">府中センター</div>
      </div>
    </div>
    <div class="cloud-pill" id="cloudPill"><i class="ti ti-cloud-off"></i><span id="cloudPillText">未設定</span></div>
    <button class="icon-btn" id="settingsBtn" aria-label="設定"><i class="ti ti-settings"></i></button>
  </header>

  <!-- ============= モードタブ ============= -->
  <nav class="mode-tabs">
    <button class="mode-tab active" data-mode="lookup">
      <i class="ti ti-search"></i>商品照会
    </button>
    <button class="mode-tab" data-mode="inv">
      <i class="ti ti-clipboard-check"></i>棚卸スキャン
    </button>
  </nav>

  <!-- ============= Main ============= -->
  <main class="main" id="main">

    <!-- スキャナー -->
    <div class="scanner off" id="scanner">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="canvas" hidden></canvas>
      <div class="scan-frame"></div>
      <div class="scan-hint" id="scanHint">「カメラ起動」を押してQRコードを枠内に映してください</div>
    </div>

    <!-- カメラ制御 -->
    <div class="camera-controls">
      <button class="btn btn-primary" id="cameraBtn">
        <i class="ti ti-camera"></i>カメラ起動
      </button>
      <button class="btn btn-ghost" id="cameraStopBtn" hidden>
        <i class="ti ti-camera-off"></i>停止
      </button>
    </div>
    <!-- 診断・フォールバック手段 -->
    <div class="camera-controls" style="border-top:none;padding-top:0;">
      <label class="btn btn-outline" for="photoInput">
        <i class="ti ti-photo"></i>画像から読取
      </label>
      <input type="file" id="photoInput" accept="image/*" hidden>
      <button class="btn btn-outline" id="manualBtn">
        <i class="ti ti-keyboard"></i>管理番号を手入力
      </button>
    </div>

    <!-- ===== 商品照会モード ===== -->
    <div class="result-panel" id="lookupPanel">
      <div class="result-empty" id="lookupEmpty">
        <i class="ti ti-qrcode-off"></i>
        <div>QRコードをスキャンすると<br>商品情報が表示されます</div>
      </div>
      <div id="lookupResult" hidden></div>
    </div>

    <!-- ===== 棚卸スキャンモード ===== -->
    <div id="invPanel" hidden>
      <div id="shelfCtx" class="shelf-ctx unset">
        <i class="ti ti-alert-circle"></i>
        <div class="body">
          <div class="msg">棚QRをまずスキャンしてください</div>
          <div class="desc">先に棚QRを読み取ると、その棚の商品スキャンが記録されます</div>
        </div>
      </div>
      <div class="inv-stats">
        <span>スキャン済 <strong id="invCount">0</strong>件</span>
        <span id="invMonthLabel" style="font-size:11.5px;color:var(--text-mute);"></span>
      </div>
      <div class="inv-actions">
        <button class="btn btn-primary" id="uploadBtn">
          <i class="ti ti-cloud-upload"></i>PC側に送信
        </button>
        <button class="btn btn-outline" id="reportBtn">
          <i class="ti ti-file-spreadsheet"></i>照合レポート
        </button>
        <button class="btn btn-ghost full btn-sm" id="clearBtn">
          <i class="ti ti-trash"></i>スマホ内のスキャン履歴を全削除
        </button>
      </div>
      <ul class="inv-list" id="invList"></ul>
      <div class="result-empty" id="invEmpty">
        <i class="ti ti-clipboard"></i>
        <div>まだスキャンされていません</div>
      </div>
    </div>

  </main>

</div>

<!-- ============= 設定ドロワー ============= -->
<div class="scrim" id="settingsScrim"></div>
<aside class="settings" id="settings">
  <div class="settings-head">
    <h3>設定</h3>
    <button class="icon-btn" id="settingsCloseBtn"><i class="ti ti-x"></i></button>
  </div>
  <div class="settings-body">

    <div class="section-title">接続情報</div>
    <div class="field">
      <label>GASデプロイURL</label>
      <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <div class="hint">商品管理台帳_v6.html と同じURL</div>
    </div>
    <div class="field">
      <label>シークレットキー</label>
      <input type="text" id="cfgSecret" placeholder="gas_server.gs の SECRET_KEY と同じ値">
    </div>
    <div class="field">
      <label>棚卸対象月（YYYY-MM）</label>
      <input type="month" id="cfgMonth">
      <div class="hint">スキャン記録の集計月。基本は当月。</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-sm" id="cfgSaveBtn"><i class="ti ti-device-floppy"></i>保存</button>
      <button class="btn btn-outline btn-sm" id="cfgPingBtn"><i class="ti ti-plug"></i>接続テスト</button>
    </div>

    <div class="divider"></div>

    <div class="section-title">商品マスタ（照会用キャッシュ）</div>
    <dl class="kv">
      <dt>キャッシュ件数</dt><dd id="kvCacheCount">—</dd>
      <dt>最終取得</dt><dd id="kvCacheAt">—</dd>
    </dl>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="cfgRefreshBtn"><i class="ti ti-refresh"></i>商品データを取得（getAll）</button>
    </div>

    <div class="divider"></div>

    <div class="section-title">処理ログ</div>
    <div class="log" id="log"><div class="log-row">（操作するとここに表示されます）</div></div>
  </div>
</aside>

<!-- ============= Toast ============= -->
<div class="toast-container" id="toasts"></div>

<script>
/* ===========================================================
   リユース推進部 商品管理台帳 v6 — スマホQRスキャン画面
   ===========================================================
   - 商品照会モード：QR→GAS getAllキャッシュから検索→詳細表示
   - 棚卸スキャンモード：QR→IndexedDBに蓄積→PC送信→照合レポート
   - 設計：v6.html とは独立した単一HTMLファイル
   - 認証：GAS方式（fc_gas_url localStorageキーを共用）
=========================================================== */

const LS_GAS = 'fc_gas_url';
const IDB_NAME = 'fc_scan_v3';
const IDB_STORE = 'scans';
const IDB_VERSION = 1;
const DUP_DEBOUNCE_MS = 1500;

/* ===== state ===== */
const state = {
  mode: 'lookup',                  // 'lookup' | 'inv'
  gas: { url:'', secret:'', month:'' },
  cache: { products: null, byId: null, at: null },
  scans: [],                       // IndexedDBから読み込んだ全件
  scanning: false,
  stream: null,
  lastScanData: null,
  lastScanTime: 0,
  log: [],
  // --- v6.3: 棚コンテキスト ---
  currentShelf: '',                // 現在スキャン中の棚コード（例: FC-S-03-01-03）
};

/* ============= ユーティリティ ============= */
function $(sel){ return document.querySelector(sel); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function toast(msg, kind=''){
  const c = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind||'');
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(), 250); }, 2400);
}
function logLine(msg, kind=''){
  const ts = new Date().toLocaleTimeString('ja-JP',{hour12:false});
  state.log.unshift({ts,msg,kind});
  if(state.log.length > 80) state.log.length = 80;
  const el = $('#log');
  if(el) el.innerHTML = state.log.map(e =>
    `<div class="log-row ${e.kind||''}">[${e.ts}] ${escapeHtml(e.msg)}</div>`).join('');
  console.log('[scan]', msg);
}
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'sc-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,12);
}
function deviceLabel(){
  try{
    const ua = navigator.userAgent;
    if(/iPhone/.test(ua)) return 'iPhone';
    if(/iPad/.test(ua))   return 'iPad';
    if(/Android/.test(ua)) return 'Android';
    return 'other';
  }catch(e){ return 'other'; }
}
function currentYM(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function fmtYMD(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleString('ja-JP',{hour12:false});
  }catch(e){ return iso; }
}

/* ============= 設定の保存/読込 ============= */
function loadConfig(){
  try{
    const raw = localStorage.getItem(LS_GAS);
    if(raw){
      const obj = JSON.parse(raw);
      if(obj && typeof obj === 'object'){
        state.gas.url    = obj.url || '';
        state.gas.secret = obj.secret || '';
        state.gas.month  = obj.scanMonth || currentYM();
      }
    }
  }catch(e){ /* ignore */ }
  if(!state.gas.month) state.gas.month = currentYM();
}
function saveConfig(){
  try{
    // v6.htmlの設定（同キー）を破壊しないようマージ
    let cur = {};
    try { cur = JSON.parse(localStorage.getItem(LS_GAS)||'{}') || {}; } catch(e){}
    cur.url = state.gas.url;
    cur.secret = state.gas.secret;
    cur.scanMonth = state.gas.month;
    localStorage.setItem(LS_GAS, JSON.stringify(cur));
  }catch(e){
    toast('設定の保存に失敗','error');
  }
}

/* ============= GAS API ============= */
async function gasCall(action, payload, method){
  if(!state.gas.url) throw new Error('GASデプロイURLが未設定です');
  method = method || 'GET';
  const url = state.gas.url;
  let r;
  if(method === 'GET'){
    const qs = new URLSearchParams({ action, secret: state.gas.secret||'' });
    if(payload && typeof payload === 'object'){
      for(const k in payload){
        if(typeof payload[k]==='string'||typeof payload[k]==='number') qs.set(k, payload[k]);
      }
    }
    r = await fetch(url + (url.includes('?')?'&':'?') + qs.toString(), {method:'GET', redirect:'follow'});
  }else{
    const body = JSON.stringify({ action, secret: state.gas.secret||'', data: payload==null?null:payload });
    r = await fetch(url, { method:'POST', redirect:'follow', body });
  }
  if(!r.ok){
    const t = await r.text();
    throw new Error('HTTP '+r.status+': '+t.slice(0,200));
  }
  const text = await r.text();
  let j;
  try { j = JSON.parse(text); } catch(e){
    throw new Error('GAS応答が不正（HTML？）: '+text.slice(0,120));
  }
  if(j.error) throw new Error(j.error);
  return j.data;
}
const gasApi = {
  ping:           ()    => gasCall('ping', null, 'GET'),
  getAll:         ()    => gasCall('getAll', null, 'GET'),
  addInvScan:     (arr) => gasCall('addInvScan', arr, 'POST'),
};

/* ============= IndexedDB ============= */
function openDb(){
  return new Promise((res, rej) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        const store = db.createObjectStore(IDB_STORE, { keyPath: 'scan_id' });
        store.createIndex('scanned_id', 'scanned_id', { unique: false });
        store.createIndex('uploaded', 'uploaded', { unique: false });
      }
    };
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
function idbAdd(record){
  return openDb().then(db => new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).add(record);
    tx.oncomplete = ()=>res();
    tx.onerror    = ()=>rej(tx.error);
  }));
}
function idbGetAll(){
  return openDb().then(db => new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).getAll();
    req.onsuccess = ()=> res(req.result || []);
    req.onerror   = ()=> rej(req.error);
  }));
}
function idbGetByScannedId(scannedId){
  return openDb().then(db => new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const idx = tx.objectStore(IDB_STORE).index('scanned_id');
    const req = idx.getAll(scannedId);
    req.onsuccess = ()=> res(req.result || []);
    req.onerror   = ()=> rej(req.error);
  }));
}
function idbDelete(scanId){
  return openDb().then(db => new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(scanId);
    tx.oncomplete = ()=>res();
    tx.onerror    = ()=>rej(tx.error);
  }));
}
function idbClear(){
  return openDb().then(db => new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).clear();
    tx.oncomplete = ()=>res();
    tx.onerror    = ()=>rej(tx.error);
  }));
}
function idbMarkUploaded(scanIds){
  return openDb().then(db => new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const store = tx.objectStore(IDB_STORE);
    const now = new Date().toISOString();
    let remaining = scanIds.length;
    if(remaining === 0){ tx.oncomplete=()=>res(); return; }
    scanIds.forEach(id => {
      const req = store.get(id);
      req.onsuccess = () => {
        const r = req.result;
        if(r){ r.uploaded = true; r.upload_at = now; store.put(r); }
        remaining--;
      };
    });
    tx.oncomplete = ()=>res();
    tx.onerror    = ()=>rej(tx.error);
  }));
}

/* ============= カメラ ============= */
async function startCamera(){
  if(state.stream) return;
  // jsQR が読み込まれているか念のため確認
  if(typeof jsQR === 'undefined'){
    toast('jsQRライブラリの読込失敗（ネット接続をご確認ください）','error');
    logLine('jsQR未ロード', 'err');
    return;
  }
  try{
    state.scanAttempts = 0;
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        // 高解像度を要求（QR検出精度向上）
        width:  { ideal: 1280 },
        height: { ideal: 720 },
      },
      audio: false,
    });
    const video = $('#video');
    video.srcObject = state.stream;
    // iOS Safari は loadedmetadata まで videoWidth が 0 になる
    await new Promise((res) => {
      if(video.readyState >= 1 && video.videoWidth > 0) return res();
      video.addEventListener('loadedmetadata', () => res(), { once: true });
      // 念のため2秒でタイムアウト
      setTimeout(res, 2000);
    });
    await video.play();
    state.scanning = true;
    $('#scanner').classList.remove('off');
    $('#scanHint').textContent = 'QRコードを枠内に映してください';
    $('#cameraBtn').hidden = true;
    $('#cameraStopBtn').hidden = false;
    requestAnimationFrame(tick);
    logLine('カメラ起動 (解像度 ' + video.videoWidth + '×' + video.videoHeight + ')', 'ok');
  }catch(e){
    logLine('カメラ起動失敗: '+e.message, 'err');
    const msg = e.name === 'NotAllowedError'
      ? 'カメラ権限が拒否されました（Safariの設定でカメラを許可してください）'
      : 'カメラ起動失敗: ' + e.message;
    toast(msg, 'error');
  }
}
function stopCamera(){
  state.scanning = false;
  if(state.stream){
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
  const video = $('#video');
  video.srcObject = null;
  $('#scanner').classList.add('off');
  $('#scanHint').textContent = '「カメラ起動」を押してQRコードを枠内に映してください';
  $('#cameraBtn').hidden = false;
  $('#cameraStopBtn').hidden = true;
  logLine('カメラ停止');
}
function computeImageStats(data){
  let sum=0, min=255, max=0, n=0;
  const step = Math.max(4, Math.floor(data.length / 4 / 2000)*4);
  for(let i=0; i<data.length; i+=step){
    const b = (data[i]+data[i+1]+data[i+2])/3;
    sum += b; n++;
    if(b<min) min=b;
    if(b>max) max=b;
  }
  return { avg: Math.round(sum/n), min: Math.round(min), max: Math.round(max), n };
}

/* ===== QR検出（BarcodeDetector優先・jsQRフォールバック） =====
   iOS 17+ Safariの BarcodeDetector は AppleネイティブQR検出を使うため
   jsQR より遥かに堅牢で精度が高い。未対応端末では従来のjsQRで処理する。
*/
async function ensureBarcodeDetector(){
  if(state.barcodeDetector === undefined){
    state.barcodeDetector = null;
    if('BarcodeDetector' in window){
      try{
        // qr_codeサポートを確認
        const supported = await BarcodeDetector.getSupportedFormats();
        if(supported && supported.indexOf('qr_code') >= 0){
          state.barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
          logLine('ネイティブBarcodeDetector利用可', 'ok');
        }else{
          logLine('BarcodeDetectorはqr_code非対応');
        }
      }catch(e){
        logLine('BarcodeDetector初期化失敗: '+e.message, 'err');
      }
    }else{
      logLine('BarcodeDetector非搭載 → jsQRを使用');
    }
  }
  return state.barcodeDetector;
}

/* ZXing decoder セットアップ（UMD版 @zxing/library） */
function ensureZxingDecoder(){
  if(state.zxingDecoder !== undefined) return state.zxingDecoder;
  state.zxingDecoder = null;
  try{
    if(typeof ZXing === 'undefined') {
      logLine('ZXing非読込（CDN障害？）');
      return null;
    }
    if(!ZXing.QRCodeReader){
      logLine('ZXing.QRCodeReader未提供');
      return null;
    }
    const reader = new ZXing.QRCodeReader();
    const hints = new Map();
    if(ZXing.DecodeHintType){
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    }
    // BrowserQRCodeReader が利用可能ならそれも使う
    let browserReader = null;
    if(ZXing.BrowserQRCodeReader){
      try{ browserReader = new ZXing.BrowserQRCodeReader(); }
      catch(e){ logLine('BrowserQRCodeReader初期化失敗: '+e.message); }
    }
    state.zxingDecoder = { reader, hints, browserReader };
    logLine('ZXing利用可' + (browserReader ? ' (Browser+Low)' : ' (Low only)'), 'ok');
  }catch(e){
    logLine('ZXing初期化失敗: '+e.message, 'err');
  }
  return state.zxingDecoder;
}

/* RGBA(Uint8ClampedArray) → 輝度(Uint8ClampedArray) 変換
   ZXingの RGBLuminanceSource は輝度値（1ピクセル=1バイト）を期待する。
   ITU-R BT.601 係数で変換（R*0.299 + G*0.587 + B*0.114）。 */
function rgbaToLuminance(rgba, width, height){
  const n = width * height;
  const lum = new Uint8ClampedArray(n);
  for(let i=0, j=0; j<n; i+=4, j++){
    lum[j] = (rgba[i] * 77 + rgba[i+1] * 150 + rgba[i+2] * 29) >> 8;
  }
  return lum;
}

function tryZxingOnCanvas(canvas){
  const z = ensureZxingDecoder();
  if(!z) return null;
  // (A) BrowserQRCodeReader.decodeFromCanvas を試す（あれば最も簡便）
  if(z.browserReader && typeof z.browserReader.decodeFromCanvas === 'function'){
    try{
      const r = z.browserReader.decodeFromCanvas(canvas);
      if(r){
        const t = (typeof r.getText === 'function') ? r.getText() : (r.text || '');
        if(t) return { text: t, sub: 'browser' };
      }
    }catch(e){
      state.lastZxingError = 'browser: ' + ((e && (e.message||e.name)) || 'unknown');
    }
  }
  // (B) 低レベルAPIで手動RGBA→輝度変換して decode
  try{
    const ctx = canvas.getContext('2d');
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const lum = rgbaToLuminance(img.data, canvas.width, canvas.height);
    const src = new ZXing.RGBLuminanceSource(lum, canvas.width, canvas.height);
    const bin = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
    const r = z.reader.decode(bin, z.hints);
    if(r){
      const t = (typeof r.getText === 'function') ? r.getText() : (r.text || '');
      if(t) return { text: t, sub: 'low' };
    }
  }catch(e){
    state.lastZxingError = 'low: ' + ((e && (e.message||e.name)) || 'unknown');
  }
  return null;
}

function tryZxingOnImageData(imageData){
  // 互換ラッパ（既存コードが呼び出している）
  const cv = document.createElement('canvas');
  cv.width = imageData.width; cv.height = imageData.height;
  cv.getContext('2d').putImageData(imageData, 0, 0);
  const r = tryZxingOnCanvas(cv);
  return r ? r.text : null;
}

async function detectQRFromSource(source){
  // 共通: source → ImageData を一度だけ生成
  let imageData = null;
  let cw = 0, ch = 0;
  if(source instanceof ImageData){
    imageData = source; cw = source.width; ch = source.height;
  }else{
    cw = source.naturalWidth || source.videoWidth || source.width || 0;
    ch = source.naturalHeight || source.videoHeight || source.height || 0;
    if(!cw || !ch) return null;
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    try{
      const ctx = cv.getContext('2d');
      ctx.drawImage(source, 0, 0, cw, ch);
      imageData = ctx.getImageData(0,0,cw,ch);
    }catch(e){ return null; }
  }

  // 1) BarcodeDetector（iOS17+）
  const detector = await ensureBarcodeDetector();
  if(detector){
    try{
      const codes = await detector.detect(source instanceof ImageData ? null : source);
      if(codes && codes.length > 0 && codes[0].rawValue){
        return { data: codes[0].rawValue, method: 'native' };
      }
    }catch(e){ /* fall through */ }
  }

  // 2) ZXing（最も堅牢）→ canvasで処理する関数を直接呼ぶ
  try{
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    cv.getContext('2d').putImageData(imageData, 0, 0);
    const zr = tryZxingOnCanvas(cv);
    if(zr) return { data: zr.text, method: 'zxing-'+zr.sub };
  }catch(e){
    state.lastZxingError = 'wrap: ' + (e.message||e.name||'unknown');
  }

  // 3) jsQR フォールバック（モード個別try/catchで隔離）
  if(typeof jsQR !== 'undefined'){
    const modes = ['dontInvert','onlyInvert','attemptBoth'];
    for(const m of modes){
      try{
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: m });
        if(code && code.data) return { data: code.data, method: 'jsQR-'+m };
      }catch(e){
        state.lastJsqrError = e && e.message ? e.message : 'unknown';
      }
    }
  }
  return null;
}

/* ===== カメラスキャンループ ===== */
async function tick(){
  if(!state.scanning) return;
  const video = $('#video');
  state.scanAttempts = (state.scanAttempts || 0) + 1;
  if(state.detecting){
    // 前回検出処理中ならスキップして次フレームへ
    requestAnimationFrame(tick);
    return;
  }
  if(video.readyState >= 2 && video.videoWidth > 0){
    state.detecting = true;
    try{
      const result = await detectQRFromSource(video);
      if(result && result.data){
        const displayData = fixEncoding(result.data);
        // ヒントには管理番号のみ表示（商品名は商品照会カードで正規取得・表示）
        const idOnly = (displayData.split('|')[0]||'').trim() || displayData.substring(0,36);
        $('#scanHint').textContent = '✓ 検出('+result.method+'): ' + idOnly;
        const now = Date.now();
        if(result.data !== state.lastScanData || (now - state.lastScanTime) > DUP_DEBOUNCE_MS){
          state.lastScanData = result.data;
          state.lastScanTime = now;
          handleScan(result.data);
        }
      }else if(state.scanAttempts % 15 === 0){
        // 1秒に1回 統計を更新
        try{
          const cv = $('#canvas');
          if(cv.width !== video.videoWidth)  cv.width  = video.videoWidth;
          if(cv.height !== video.videoHeight) cv.height = video.videoHeight;
          const ctx = cv.getContext('2d');
          ctx.drawImage(video, 0, 0, cv.width, cv.height);
          const img = ctx.getImageData(0,0,cv.width,cv.height);
          const st = computeImageStats(img.data);
          const avail = [];
          if(state.barcodeDetector) avail.push('native');
          if(state.zxingDecoder)    avail.push('zxing');
          if(typeof jsQR !== 'undefined') avail.push('jsQR');
          const detName = avail.length ? avail.join('+') : 'なし';
          const errStr = state.lastZxingError ? ' ZX:'+state.lastZxingError.substring(0,30) : '';
          $('#scanHint').textContent = '試行'+state.scanAttempts+
            ' / '+cv.width+'×'+cv.height+
            ' 輝度avg='+st.avg+
            ' ['+detName+']'+errStr;
        }catch(e){
          $('#scanHint').textContent = '試行'+state.scanAttempts+' (統計取得失敗)';
        }
      }
    }catch(e){
      if(state.scanAttempts % 30 === 0){
        $('#scanHint').textContent = '検出エラー: ' + (e.message||e.name||'unknown');
      }
    }finally{
      state.detecting = false;
    }
  }else if(state.scanAttempts % 15 === 0){
    $('#scanHint').textContent = 'カメラ準備中… state=' + video.readyState +
      ' size=' + video.videoWidth + '×' + video.videoHeight;
  }
  requestAnimationFrame(tick);
}

/* ===== 画像読取（フォトライブラリ） ===== */
async function readQRFromImageFile(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = async () => {
      try{
        // 統計用に縮小キャンバスで輝度をログ
        const cv = document.createElement('canvas');
        const MAX = 1600;
        let w = img.naturalWidth, h = img.naturalHeight;
        if(Math.max(w,h) > MAX){
          const r = MAX/Math.max(w,h);
          w = Math.round(w*r); h = Math.round(h*r);
        }
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{
          const imgData = ctx.getImageData(0,0,w,h);
          const st = computeImageStats(imgData.data);
          logLine('画像読込 '+w+'×'+h+' avg='+st.avg+' min='+st.min+' max='+st.max);
        }catch(e){}
        // BarcodeDetector に元画像を直接渡せるよう Image を優先利用
        const result = await detectQRFromSource(img);
        URL.revokeObjectURL(img.src);
        if(result){
          logLine('画像から検出('+result.method+'): '+result.data, 'ok');
          resolve(result.data);
        }else{
          if(state.lastZxingError){
            logLine('ZXing最終エラー: '+state.lastZxingError, 'err');
          }
          if(state.lastJsqrError){
            logLine('jsQR最終エラー: '+state.lastJsqrError, 'err');
          }
          logLine('画像内にQRが見つかりません', 'err');
          resolve(null);
        }
      }catch(e){
        try{ URL.revokeObjectURL(img.src); }catch(_){}
        reject(e);
      }
    };
    img.onerror = () => reject(new Error('画像読込失敗'));
    img.src = URL.createObjectURL(file);
  });
}
async function onPhotoSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  toast('画像を解析中…');
  try{
    const data = await readQRFromImageFile(file);
    if(data){
      toast('✓ 検出: ' + data.substring(0,28), 'success');
      handleScan(data);
    }else{
      toast('QRが検出できませんでした', 'warn');
    }
  }catch(err){
    toast('画像解析エラー: ' + err.message, 'error');
    logLine('画像解析例外: '+err.message, 'err');
  }
  e.target.value = '';
}

/* ===== 手入力フォールバック ===== */
function onManualInput(){
  const id = (prompt('管理番号を入力してください（例: FC-260514-S-003）') || '').trim();
  if(!id) return;
  if(!id.startsWith('FC-')){
    if(!confirm('FC-で始まらない管理番号ですが、続行しますか？')) return;
  }
  // パイプ区切り形式に整形して handleScan へ
  handleScan(id + '||');
}

/* ============= QRハンドラ ============= */
/* Latin-1 として誤読された UTF-8 バイト列を正しく復元する。
   ZXing.js は ECI が無い QR を decode すると、UTF-8バイトでも
   Latin-1 文字列として返してしまうことがあるため対策。 */
function fixEncoding(str){
  if(!str) return str;
  // 範囲外の高位バイトを含む（Latin-1範囲）かつ
  // 既にCJK範囲が含まれていない場合のみ復元を試みる
  let hasHighByte = false, hasCJK = false;
  for(let i=0; i<str.length; i++){
    const c = str.charCodeAt(i);
    if(c >= 0x80 && c <= 0xFF) hasHighByte = true;
    if(c >= 0x3000 && c <= 0x9FFF) hasCJK = true;
    if(c >= 0xFF00 && c <= 0xFFEF) hasCJK = true;
  }
  if(!hasHighByte || hasCJK) return str;
  try{
    // 各文字を1バイトとして Uint8Array に詰めて UTF-8 として復元
    const bytes = new Uint8Array(str.length);
    for(let i=0; i<str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    return decoded;
  }catch(e){
    // UTF-8として不正 → 元の文字列をそのまま返す
    return str;
  }
}

function parseQR(data){
  // 一括で文字化け復元を試みる
  const fixed = fixEncoding(String(data||''));
  const parts = fixed.split('|');
  // 先頭が 'SHELF' なら棚QR、'FC-...' なら商品QR
  const head = (parts[0]||'').trim();
  if(head === 'SHELF'){
    return {
      type:  'shelf',
      code:  (parts[1]||'').trim(),
      raw:   fixed,
    };
  }
  return {
    type:  'product',
    id:    head,
    name:  (parts[1]||'').trim(),
    rank:  (parts[2]||'').trim(),
    shelf: (parts[3]||'').trim(),   // 4番目=棚番号（旧QRは空文字・後方互換）
    raw:   fixed,
  };
}
async function handleScan(data){
  const q = parseQR(data);

  // 棚QRの場合（棚卸モードのみ意味を持つ）
  if(q.type === 'shelf'){
    if(state.mode !== 'inv'){
      toast('棚QRは「棚卸スキャン」モードでのみ有効です', 'warn');
      return;
    }
    try { if(navigator.vibrate) navigator.vibrate([40,40,40]); } catch(e){}
    doShelfScan(q);
    return;
  }

  // 商品QR（共通: 商品照会 / 棚卸スキャン）
  if(!q.id){
    toast('QR読取エラー（管理番号が空）', 'warn');
    return;
  }
  // 軽い触覚フィードバック
  try { if(navigator.vibrate) navigator.vibrate(60); } catch(e){}
  if(state.mode === 'lookup'){
    await doLookup(q);
  }else{
    await doInvScan(q);
  }
}

/* ============= 棚QRスキャン（コンテキスト切替） ============= */
function doShelfScan(q){
  if(!q.code){
    toast('棚QRエラー（棚コードが空）', 'warn');
    return;
  }
  const prev = state.currentShelf;
  state.currentShelf = q.code;
  // 同じ棚を再スキャンした場合は確認メッセージのみ
  if(prev === q.code){
    toast('現在の棚: ' + q.code + '（変更なし）', 'success');
  }else if(prev){
    toast('棚を切替: ' + prev + ' → ' + q.code, 'success');
    logLine('棚切替: ' + prev + ' → ' + q.code, 'ok');
  }else{
    toast('棚を確定: ' + q.code, 'success');
    logLine('棚確定: ' + q.code, 'ok');
  }
  renderInvList();
}

/* ============= 商品照会モード ============= */
async function ensureCache(force){
  if(state.cache.byId && !force) return state.cache.byId;
  if(!state.gas.url){
    throw new Error('GAS未設定です。設定画面でURL/シークレットを入力してください。');
  }
  logLine('商品データを取得中…');
  const items = await gasApi.getAll();
  if(!Array.isArray(items)) throw new Error('GASの応答が配列ではありません');
  const map = new Map();
  items.forEach(p => { if(p && p.id) map.set(String(p.id), p); });
  state.cache.products = items;
  state.cache.byId = map;
  state.cache.at = new Date().toISOString();
  logLine('商品 ' + items.length + ' 件キャッシュ', 'ok');
  updateCacheInfo();
  return map;
}
async function doLookup(q){
  try{
    const map = await ensureCache(false);
    const p = map.get(q.id);
    if(!p){
      renderLookupError(q, '該当する管理番号が見つかりません');
      logLine('照会: ' + q.id + ' → 見つからず', 'err');
      return;
    }
    renderLookupResult(p);
    logLine('照会: ' + q.id + ' → ' + (p.name||''), 'ok');
  }catch(e){
    renderLookupError(q, e.message);
    logLine('照会失敗: ' + e.message, 'err');
  }
}
function renderLookupResult(p){

  result.innerHTML = `

      <span class="status-bar ${statusCls}">${escapeHtml(p.status||'-')}</span>

        ${p.status==='販売済' && p.salePrice!==''&&p.salePrice!=null ? `<dt>売上価格</dt><dd class="cost">¥${Number(p.salePrice).toLocaleString()}</dd>` : ''}

/* ============= 棚卸スキャンモード ============= */
async function refreshScans(){
  state.scans = await idbGetAll();
  // 新しい順
  state.scans.sort((a,b) => (b.scanned_at||'').localeCompare(a.scanned_at||''));
  renderInvList();
}
async function doInvScan(q){
  // 棚QRが未スキャンの場合は厳格警告（B案：商品スキャン拒否）
  if(!state.currentShelf){
    try { if(navigator.vibrate) navigator.vibrate([60,60,60,60,60]); } catch(e){}
    toast('先に棚QRをスキャンしてください', 'error');
    logLine('棚未確定で商品スキャン → 拒否: ' + q.id, 'err');
    // 警告音を視覚的に強調
    const ctx = document.getElementById('shelfCtx');
    if(ctx){
      ctx.classList.add('unset');
      ctx.style.animation = 'shake 0.4s';
      setTimeout(() => { ctx.style.animation = ''; }, 500);
    }
    return;
  }
  // 重複チェック
  const existing = await idbGetByScannedId(q.id);
  if(existing && existing.length > 0){
    try { if(navigator.vibrate) navigator.vibrate([60,60,160]); } catch(e){}
    toast('重複: ' + q.id + ' は既にスキャン済', 'warn');
    logLine('重複スキャン: ' + q.id, 'err');
    return;
  }
  const rec = {
    scan_id: uuid(),
    scanned_id: q.id,
    scanned_name: q.name,
    scanned_rank: q.rank,
    scanned_shelf: state.currentShelf,   // 現在の棚コンテキストを採用
    scanned_at: new Date().toISOString(),
    device: deviceLabel(),
    inventory_month: state.gas.month || currentYM(),
    uploaded: false,
  };
  try{
    await idbAdd(rec);
    state.scans.unshift(rec);
    renderInvList();
    toast('追加: ' + q.id, 'success');
    logLine('スキャン追加: ' + q.id, 'ok');
  }catch(e){
    toast('保存失敗: ' + e.message, 'error');
    logLine('IDB追加失敗: ' + e.message, 'err');
  }
}
function renderInvList(){
  // 棚コンテキストカードを更新
  updateShelfCtxCard();

  const ul = $('#invList');
  const empty = $('#invEmpty');
  $('#invCount').textContent = state.scans.length;
  $('#invMonthLabel').textContent = '対象月: ' + (state.gas.month || currentYM());
  if(state.scans.length === 0){
    ul.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  // 棚切替セパレータ用：state.scans は新しい順なので prev = scans[i-1] が時系列の後（新しい方）
  // 各scanについて、その scanned_shelf が prev と異なれば、その上にセパレータを挿入する
  const parts = [];
  state.scans.forEach((s, i) => {
    const prev = state.scans[i-1];
    const isShelfTransition = !prev || (prev.scanned_shelf||'') !== (s.scanned_shelf||'');
    if(isShelfTransition){
      const sh = s.scanned_shelf || '(棚未確定)';
      parts.push(`<li class="shelf-sep"><i class="ti ti-pin"></i>棚: ${escapeHtml(sh)}</li>`);
    }
    parts.push(`<li class="inv-row ${s.uploaded?'uploaded':''}" data-scan-id="${escapeHtml(s.scan_id)}">
      <div class="info">
        <div class="id">${escapeHtml(s.scanned_id)}</div>
        <div class="nm">${escapeHtml(s.scanned_name||'(品名なし)')}</div>
        <div class="meta">
          <span class="rk">${escapeHtml(s.scanned_rank||'-')}</span>
          <span>棚: ${s.scanned_shelf?escapeHtml(s.scanned_shelf):'—'}</span>
          <span>${escapeHtml(fmtYMD(s.scanned_at))}</span>
          ${s.uploaded?'<span class="up">✓送信済</span>':''}
        </div>
      </div>
      <button class="del" data-del-id="${escapeHtml(s.scan_id)}" aria-label="削除"><i class="ti ti-trash"></i></button>
    </li>`);
  });
  ul.innerHTML = parts.join('');

  ul.querySelectorAll('.del').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const id = b.dataset.delId;
      onDeleteScan(id);
    });
  });
}

async function onDeleteScan(scanId){
  if(!confirm('このスキャン記録を削除しますか？')) return;
  try{
    await idbDelete(scanId);
    state.scans = state.scans.filter(s => s.scan_id !== scanId);
    renderInvList();
    toast('削除しました');
    logLine('削除: ' + scanId);
  }catch(e){
    toast('削除失敗: ' + e.message, 'error');
  }
}
async function onClearAll(){
  if(!confirm('スマホ内のスキャン記録を全削除します。\nGoogle Sheets側のデータには影響しません。実行しますか？')) return;
  try{
    await idbClear();
    state.scans = [];
    renderInvList();
    toast('全削除しました', 'success');
    logLine('IndexedDB全削除', 'ok');
  }catch(e){
    toast('全削除失敗: ' + e.message, 'error');
  }
}
async function onUpload(){
  if(state.scans.length === 0){ toast('スキャン記録がありません','warn'); return; }
  if(!state.gas.url){ toast('GAS未設定です（設定画面で入力）','warn'); return; }
  const targets = state.scans.filter(s => !s.uploaded);
  if(targets.length === 0){
    if(!confirm('すべて送信済です。再度同じ内容を送信しますか？')) return;
    // 強制再送
    return doUpload(state.scans);
  }
  return doUpload(targets);
}
async function doUpload(targets){
  try{
    logLine('PC側へ ' + targets.length + ' 件送信中…');
    toast(targets.length + '件送信中…');
    // GAS addInvScan は配列を受け取って一括追加する実装
    const payload = targets.map(s => ({
      scan_id:        s.scan_id,
      scanned_id:     s.scanned_id,
      scanned_name:   s.scanned_name,
      scanned_rank:   s.scanned_rank,
      scanned_at:     s.scanned_at,
      device:         s.device,
      inventory_month:s.inventory_month,
    }));
    const r = await gasApi.addInvScan(payload);
    await idbMarkUploaded(targets.map(s => s.scan_id));
    await refreshScans();
    logLine('送信完了: ' + JSON.stringify(r), 'ok');
    toast('送信完了（' + targets.length + '件）', 'success');
  }catch(e){
    logLine('送信失敗: ' + e.message, 'err');
    toast('送信失敗: ' + e.message, 'error');
  }
}

/* 棚番号一致判定 */
function shelfMatchLabel(registeredShelf, scannedShelf){
  // どちらも空 → 「未登録」
  if(!registeredShelf && !scannedShelf) return '未登録';
  // スキャン時の棚番号が空（旧QRフォーマット）→ 「確認不可」
  if(!scannedShelf) return '確認不可';
  // 台帳の棚番号だけ空 → 「台帳未登録」
  if(!registeredShelf) return '台帳未登録';
  // 大小文字・全角空白を統一して比較
  const norm = s => String(s).trim().replace(/　/g,' ').toLowerCase();
  return norm(registeredShelf) === norm(scannedShelf) ? '一致' : '不一致';
}

function buildAndDownloadReport(products, scans){
  // スキャンID集合・スキャン日時マップ
  const scannedMap = new Map();
  scans.forEach(s => { if(!scannedMap.has(s.scanned_id)) scannedMap.set(s.scanned_id, s); });
  const productIds = new Set(products.map(p => String(p.id)));

  const rows = [];   // sheet1
  let cMatch=0, cUnscanned=0, cSold=0, cUnknown=0;

  products.forEach(p => {
    const sid = String(p.id);
    // v6.4: 在庫中・出品中 を「物理在庫」として同じく扱う
    if(p.status === '在庫中' || p.status === '出品中'){
      if(scannedMap.has(sid)){
        const sc = scannedMap.get(sid);
        rows.push([
          '一致', p.id, p.name||'', p.cat||'', p.rank||'',
          p.shelf||'',                    // 台帳登録棚番号
          sc.scanned_shelf||'',           // スキャン時棚番号
          shelfMatchLabel(p.shelf, sc.scanned_shelf), // 棚番号一致
          p.status||'', p.channel||'', p.date||'', sc.scanned_at||''
        ]);
        cMatch++;
      }else{
        rows.push([
          '未スキャン', p.id, p.name||'', p.cat||'', p.rank||'',
          p.shelf||'',  // 台帳登録棚番号
          '',           // スキャン時棚番号（スキャンなし）
          '',           // 棚番号一致（スキャンなし）
          p.status||'', p.channel||'', p.date||'', ''
        ]);
        cUnscanned++;
      }
    }else if(p.status === '販売済'){
      if(scannedMap.has(sid)){
        const sc = scannedMap.get(sid);
        rows.push([
          '販売済なのにスキャン', p.id, p.name||'', p.cat||'', p.rank||'',
          p.shelf||'',
          sc.scanned_shelf||'',
          shelfMatchLabel(p.shelf, sc.scanned_shelf),
          p.status||'', p.channel||'', p.date||'', sc.scanned_at||''
        ]);
        cSold++;
      }
    }
  });
  // 不明品（スキャンされたがシステムに存在しない）
  const unknowns = [];
  scans.forEach(s => {
    if(!productIds.has(String(s.scanned_id))){
      unknowns.push(s);
      rows.push([
        '不明品', s.scanned_id, s.scanned_name||'(不明)', '', s.scanned_rank||'',
        '',                       // 台帳登録棚番号（不明品のため空）
        s.scanned_shelf||'',      // スキャン時棚番号
        '',                       // 棚番号一致（台帳に存在しないため空）
        '(不明)', '', '', s.scanned_at||''
      ]);
      cUnknown++;
    }
  });

  // 並び順：分類→管理番号
  const order = {'一致':0,'未スキャン':1,'販売済なのにスキャン':2,'不明品':3};
  rows.sort((a,b) => (order[a[0]]-order[b[0]]) || String(a[1]).localeCompare(String(b[1])));

  const total = cMatch + cUnscanned + cSold + cUnknown;
  const pct = (n) => total ? (n/total*100).toFixed(1)+'%' : '-';

  // 棚番号の集計（列インデックス 7 が「棚番号一致」）
  const cShelfMismatch = rows.filter(r => r[7] === '不一致').length;
  const cShelfUnknown  = rows.filter(r => r[7] === '確認不可').length;

  // ===== シート1: 照合結果一覧 =====
  const sh1Header = [
    '分類','管理番号','商品名','部門','ランク',
    '台帳登録棚番号','スキャン時棚番号','棚番号一致',
    'ステータス','販路','入荷日','スキャン日時'
  ];
  const sh1 = [sh1Header, ...rows];
  const ws1 = XLSX.utils.aoa_to_sheet(sh1);
  ws1['!cols'] = [
    {wch:18},  // 分類
    {wch:20},  // 管理番号
    {wch:30},  // 商品名
    {wch:6},   // 部門
    {wch:6},   // ランク
    {wch:12},  // 台帳登録棚番号
    {wch:14},  // スキャン時棚番号
    {wch:10},  // 棚番号一致
    {wch:12},  // ステータス
    {wch:10},  // 販路
    {wch:12},  // 入荷日
    {wch:22},  // スキャン日時
  ];
  if(sh1.length > 1){
    ws1['!autofilter'] = { ref: XLSX.utils.encode_range({s:{c:0,r:0},e:{c:sh1Header.length-1,r:sh1.length-1}}) };
  }

  // ===== シート2: 差異サマリー =====
  const sh2 = [
    ['項目','件数','割合'],
    ['一致', cMatch, pct(cMatch)],
    ['未スキャン', cUnscanned, pct(cUnscanned)],
    ['販売済なのにスキャン', cSold, pct(cSold)],
    ['不明品', cUnknown, pct(cUnknown)],
    ['合計', total, ''],
    [],
    ['棚番号集計（一致/不一致など）',''],
    ['棚番号不一致', cShelfMismatch, total ? (cShelfMismatch/total*100).toFixed(1)+'%' : '-'],
    ['棚番号確認不可（旧QR）', cShelfUnknown, ''],
    [],
    ['参考情報',''],
    ['スキャン件数（全）', scans.length, ''],
    ['システム物理在庫件数（在庫中＋出品中）', products.filter(p=>p.status==='在庫中' || p.status==='出品中').length, ''],
    ['対象月', state.gas.month||currentYM(), ''],
    ['出力日時', new Date().toLocaleString('ja-JP',{hour12:false}), ''],
  ];
  const ws2 = XLSX.utils.aoa_to_sheet(sh2);
  ws2['!cols'] = [{wch:26},{wch:12},{wch:12}];

  // ===== シート3: 不明品リスト =====
  const sh3Header = ['管理番号（スキャン読取）','商品名','ランク','スキャン時棚番号','スキャン日時','デバイス','対象月'];
  const sh3 = [sh3Header, ...unknowns.map(s => [
    s.scanned_id, s.scanned_name||'', s.scanned_rank||'', s.scanned_shelf||'', s.scanned_at||'', s.device||'', s.inventory_month||'',
  ])];
  const ws3 = XLSX.utils.aoa_to_sheet(sh3);
  ws3['!cols'] = [{wch:22},{wch:30},{wch:8},{wch:14},{wch:22},{wch:10},{wch:10}];
  if(sh3.length > 1){
    ws3['!autofilter'] = { ref: XLSX.utils.encode_range({s:{c:0,r:0},e:{c:sh3Header.length-1,r:sh3.length-1}}) };
  }

  // ===== シート4: 棚番号不一致リスト（新設） =====
  const sh4Header = ['管理番号','商品名','部門','ランク','台帳登録棚番号','スキャン時棚番号','入荷日','スキャン日時'];
  const mismatchRows = rows.filter(r => r[7] === '不一致');
  let sh4;
  if(mismatchRows.length === 0){
    sh4 = [['棚番号の不一致はありませんでした']];
  }else{
    sh4 = [sh4Header, ...mismatchRows.map(r => [
      r[1],   // 管理番号
      r[2],   // 商品名
      r[3],   // 部門
      r[4],   // ランク
      r[5],   // 台帳登録棚番号
      r[6],   // スキャン時棚番号
      r[10],  // 入荷日
      r[11],  // スキャン日時
    ])];
  }
  const ws4 = XLSX.utils.aoa_to_sheet(sh4);
  if(mismatchRows.length > 0){
    ws4['!cols'] = [{wch:20},{wch:30},{wch:6},{wch:6},{wch:14},{wch:14},{wch:12},{wch:22}];
    ws4['!autofilter'] = { ref: XLSX.utils.encode_range({s:{c:0,r:0},e:{c:sh4Header.length-1,r:sh4.length-1}}) };
  }else{
    ws4['!cols'] = [{wch:40}];
  }

  // ===== ファイル組み立て =====
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, '照合結果一覧');
  XLSX.utils.book_append_sheet(wb, ws2, '差異サマリー');
  XLSX.utils.book_append_sheet(wb, ws3, '不明品リスト');
  XLSX.utils.book_append_sheet(wb, ws4, '棚番号不一致リスト');

  const ym = (state.gas.month||currentYM()).replace('-','');
  const filename = `棚卸照合_${ym}_府中センター.xlsx`;
  XLSX.writeFile(wb, filename);
}

/* ============= モード切替 ============= */
function switchMode(mode){
  state.mode = mode;
  document.querySelectorAll('.mode-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  $('#lookupPanel').hidden = (mode !== 'lookup');
  $('#invPanel').hidden = (mode !== 'inv');
  if(mode === 'inv'){
    refreshScans();
  }
  // モード切替時は重複防止のlastScanをリセット
  state.lastScanData = null;
  state.lastScanTime = 0;
}

/* ============= ヘッダーピル ============= */
function updateCloudPill(){
  const el = $('#cloudPill');
  const t = $('#cloudPillText');
  el.classList.remove('ok','warn');
  const ic = el.querySelector('.ti');
  if(!state.gas.url){
    el.classList.add('warn'); ic.className='ti ti-cloud-off'; t.textContent='未設定';
  }else{
    el.classList.add('ok'); ic.className='ti ti-cloud'; t.textContent='接続';
  }
}
function updateCacheInfo(){
  const c = $('#kvCacheCount');
  const a = $('#kvCacheAt');
  if(c) c.textContent = state.cache.products ? state.cache.products.length + ' 件' : '—';
  if(a) a.textContent = state.cache.at ? fmtYMD(state.cache.at) : '—';
}

/* ============= 設定ドロワー ============= */
function openSettings(){
  $('#cfgUrl').value    = state.gas.url || '';
  $('#cfgSecret').value = state.gas.secret || '';
  $('#cfgMonth').value  = state.gas.month || currentYM();
  $('#settingsScrim').classList.add('show');
  $('#settings').classList.add('show');
  updateCacheInfo();
}
function closeSettings(){
  $('#settingsScrim').classList.remove('show');
  $('#settings').classList.remove('show');
}
function onSaveConfig(){
  state.gas.url    = $('#cfgUrl').value.trim();
  state.gas.secret = $('#cfgSecret').value.trim();
  state.gas.month  = $('#cfgMonth').value || currentYM();
  saveConfig();
  updateCloudPill();
  $('#invMonthLabel').textContent = '対象月: ' + state.gas.month;
  toast('保存しました', 'success');
  logLine('設定保存');
}
async function onPing(){
  if(!state.gas.url){ toast('URLが未設定','warn'); return; }
  try{
    logLine('接続テスト中…');
    const r = await gasApi.ping();
    logLine('接続成功: '+JSON.stringify(r), 'ok');
    toast('接続OK', 'success');
  }catch(e){
    logLine('接続失敗: '+e.message, 'err');
    toast('接続失敗: '+e.message, 'error');
  }
}
async function onRefreshCache(){
  try{
    await ensureCache(true);
    toast('商品データを更新しました', 'success');
  }catch(e){
    toast('取得失敗: '+e.message, 'error');
  }
}

/* ============= イベント配線 ============= */
function wire(){
  document.querySelectorAll('.mode-tab').forEach(b => {
    b.addEventListener('click', () => switchMode(b.dataset.mode));
  });
  $('#cameraBtn').addEventListener('click', startCamera);
  $('#cameraStopBtn').addEventListener('click', stopCamera);
  $('#photoInput').addEventListener('change', onPhotoSelected);
  $('#manualBtn').addEventListener('click', onManualInput);
  $('#uploadBtn').addEventListener('click', onUpload);
  $('#reportBtn').addEventListener('click', onGenerateReport);
  $('#clearBtn').addEventListener('click', onClearAll);

  $('#settingsBtn').addEventListener('click', openSettings);
  $('#settingsCloseBtn').addEventListener('click', closeSettings);
  $('#settingsScrim').addEventListener('click', closeSettings);
  $('#cfgSaveBtn').addEventListener('click', onSaveConfig);
  $('#cfgPingBtn').addEventListener('click', onPing);
  $('#cfgRefreshBtn').addEventListener('click', onRefreshCache);

  // 画面遷移時にカメラを止める（バックグラウンド時の節電）
  document.addEventListener('visibilitychange', () => {
    if(document.hidden && state.stream){
      stopCamera();
    }
  });
}

/* ============= 初期化 ============= */
async function init(){
  loadConfig();
  wire();
  updateCloudPill();
  await refreshScans();
  $('#invMonthLabel').textContent = '対象月: ' + (state.gas.month||currentYM());
  // QR読取ライブラリの読込確認
  if(typeof jsQR === 'undefined'){
    logLine('jsQRが未読込', 'err');
  }else{
    logLine('jsQR loaded');
  }
  if(typeof ZXing === 'undefined'){
    logLine('ZXingが未読込', 'err');
  }else{
    logLine('ZXing loaded');
    ensureZxingDecoder();
  }
  // BarcodeDetector も事前確認
  await ensureBarcodeDetector();
  // 初回起動時 GAS未設定なら案内
  if(!state.gas.url){
    setTimeout(() => {
      toast('まず歯車アイコンから設定を行ってください', 'warn');
    }, 600);
  }
  logLine('起動完了');
}
init();
</script>
